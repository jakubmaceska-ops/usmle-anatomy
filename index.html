  async function liveSubmitAdminUnlock() {
    const code = (live.adminUnlockInput || "").trim();
    if (!code) {
      live.adminUnlockError = tr().liveAdminUnlockError;
      render();
      return;
    }
    live.adminUnlockChecking = true;
    live.adminUnlockError = "";
    render();
    try {
      const resp = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      if (!resp.ok) throw new Error("rejected");
      const data = await resp.json();
      const fbAuth = window.__fbAuth;
      if (!fbAuth || !data.token) throw new Error("no token");
      await fbAuth.signInWithCustomToken(fbAuth.auth, data.token);
      // onAuthStateChanged/fb-auth-ready nastaví live.isAdminUnlocked podle
      // skutečného "admin" claimu v novém ID tokenu.
      live.showAdminUnlock = false;
      live.adminUnlockInput = "";
      live.adminUnlockError = "";
    } catch (e) {
      live.adminUnlockError = tr().liveAdminUnlockError;
    }
    live.adminUnlockChecking = false;
    render();
  }

  function liveLockAdmin() {
    const fbAuth = window.__fbAuth;
    if (fbAuth) {
      fbAuth.signOut(fbAuth.auth).catch((e) => console.error("sign-out failed:", e));
      // Po odhlášení onAuthStateChanged(user=null) automaticky znovu přihlásí
      // anonymně a live.isAdminUnlocked se vrátí na false (fb-auth-ready).
    }
  }

  // ---- Teardown (detach listeners, clear intervals) ----
  function liveTeardown() {
    const fb = getFb();
    if (fb && live.sessionId) {
      try {
        const sRef = fb.ref(fb.db, `liveSessions/${live.sessionId}`);
        fb.off(sRef);
      } catch (e) { /* noop */ }
    }
    if (live.countdownInterval) { clearInterval(live.countdownInterval); live.countdownInterval = null; }
    if (live.quizTimerInterval) { clearInterval(live.quizTimerInterval); live.quizTimerInterval = null; }
    if (live.monitorTimerInterval) { clearInterval(live.monitorTimerInterval); live.monitorTimerInterval = null; }
    if (live.autoEntryInterval) { clearInterval(live.autoEntryInterval); live.autoEntryInterval = null; }
    // Smazat zálohu odpovědí pokud session opouštíme dobrovolně (ne refresh)
    if (live.sessionId && live.resultSubmitted) liveClearAnswers(live.sessionId);
    // Dobrovolný odchod (ne refresh) — přestat sledovat tuto session pro auto-rejoin
    liveClearActiveSession();
    live.sessionId = null;
    live.sessionData = null;
    live.isAdmin = false;
    live.resultSubmitted = false;
  }

  // ---- Create session (admin only) ----
  async function liveCreateSession(opts) {
    // opts: { unitKey, qCount, durationMin }
    liveResetEphemeral();
    live.creating = true;
    render();

    try {
      const uid = await waitForAuthOrTimeout();
      const fb = getFb();
      if (!fb || !uid) { liveSetError(tr().liveErrGeneric); live.creating = false; render(); return; }

      const bank = LIVE_QUESTION_BANKS[opts.unitKey];
      const all = bank ? getLiveSessionQuestionSource(opts.unitKey, bank) : [];
      if (all.length === 0) { liveSetError(tr().liveErrGeneric); live.creating = false; render(); return; }

      const pool = prepareQuestionsForSession(all);
      const count = Math.min(opts.qCount, pool.length);
      const selected = pool.slice(0, count);
      const questionIds = selected.map(q => q.id);

      const code = genSessionCode();
      const sessionsRef = fb.ref(fb.db, "liveSessions");
      const newRef = fb.push(sessionsRef);
      const sessionId = newRef.key;

      const payload = {
        code,
        adminUid: uid,
        unitKey: opts.unitKey,
        questionIds,
        optionOrderSeed: Math.floor(Math.random() * 1e9),
        durationSec: opts.durationMin * 60,
        status: "lobby",
        createdAt: fb.serverTimestamp()
      };

      await fb.set(newRef, payload);

      live.sessionId = sessionId;
      live.isAdmin = true;
      liveSaveActiveSession(live.sessionId, live.isAdmin);
      liveAttachSessionListener();
    } catch (err) {
      console.error("liveCreateSession error:", err);
      liveSetError(tr().liveErrGeneric);
      live.creating = false;
      render();
    }
  }

  // ---- Join session (participant) ----
  async function liveJoinSession(codeRaw, nameRaw) {
    liveResetEphemeral();
    const code = (codeRaw || "").trim().toUpperCase();
    const name = (nameRaw || "").trim();

    if (!code) { liveSetError(tr().liveErrCodeRequired); return; }
    if (!name) { liveSetError(tr().liveErrNameRequired); return; }

    live.joining = true;
    render();

    try {
      const uid = await waitForAuthOrTimeout();
      const fb = getFb();
      if (!fb || !uid) { liveSetError(tr().liveErrGeneric); live.joining = false; render(); return; }

      const sessionsRef = fb.ref(fb.db, "liveSessions");
      const snap = await fb.get(sessionsRef);
      const all = snap.val() || {};
      let foundId = null;
      let foundData = null;
      Object.keys(all).forEach(id => {
        if (all[id] && (all[id].code || "").toUpperCase() === code) {
          foundId = id;
          foundData = all[id];
        }
      });

      if (!foundId) { liveSetError(tr().liveErrCodeNotFound); live.joining = false; render(); return; }
      if (foundData.status && foundData.status !== "lobby") {
        liveSetError(tr().liveErrAlreadyStarted);
        live.joining = false;
        render();
        return;
      }
      const participantCount = foundData.participants ? Object.keys(foundData.participants).length : 0;
      if (participantCount >= LIVE_MAX_PARTICIPANTS) {
        liveSetError(tr().liveErrFull);
        live.joining = false;
        render();
        return;
      }

      try { localStorage.setItem("usmle-live-name", name); } catch (e) {}
      live.myName = name;

      const participantRef = fb.ref(fb.db, `liveSessions/${foundId}/participants/${uid}`);
      await fb.set(participantRef, { name, joinedAt: fb.serverTimestamp() });

      live.sessionId = foundId;
      live.isAdmin = (foundData.adminUid === uid);
      liveSaveActiveSession(live.sessionId, live.isAdmin);
      liveAttachSessionListener();
    } catch (err) {
      console.error("liveJoinSession error:", err);
      liveSetError(tr().liveErrGeneric);
      live.joining = false;
      render();
    }
  }

  // ---- Live listener on the whole session node ----
  function liveAttachSessionListener() {
    const fb = getFb();
    if (!fb || !live.sessionId) return;
    const sRef = fb.ref(fb.db, `liveSessions/${live.sessionId}`);
    fb.onValue(sRef, (snap) => {
      const data = snap.val();
      if (!data) {
        // Session byla smazána
        live.sessionData = null;
        liveHandleSessionUpdate(null);
        return;
      }
      live.sessionData = data;
      liveHandleSessionUpdate(data);
    }, (err) => {
      console.error("session listener error:", err);
      liveSetError(tr().liveConnectionLost);
    });
  }

  // ---- React to status changes coming from Firebase ----
  let lastHandledStatus = null;

  function liveHandleSessionUpdate(data) {
    live.creating = false;
    live.joining = false;

    if (!data) {
      lastHandledStatus = null;
      liveClearActiveSession();
      if (state.view === "live") render();
      return;
    }

    const status = data.status;

    if (status === "cancelled") {
      if (lastHandledStatus !== "cancelled") {
        lastHandledStatus = "cancelled";
        if (live.quizTimerInterval) { clearInterval(live.quizTimerInterval); live.quizTimerInterval = null; }
        if (live.countdownInterval) { clearInterval(live.countdownInterval); live.countdownInterval = null; }
        if (live.monitorTimerInterval) { clearInterval(live.monitorTimerInterval); live.monitorTimerInterval = null; }
        live.view = "cancelled";
      }
      render();
      return;
    }

    if (status === "lobby") {
      live.view = live.isAdmin ? "lobbyAdmin" : "lobbyParticipant";
      lastHandledStatus = "lobby";
      render();
      return;
    }

    if (status === "countdown") {
      if (lastHandledStatus !== "countdown") {
        lastHandledStatus = "countdown";
        live.view = "countdown";
        liveStartCountdownTicker(data);
      }
      render();
      return;
    }

    if (status === "running") {
      if (lastHandledStatus !== "running" && lastHandledStatus !== "running-active" && !live.resultSubmitted) {
        lastHandledStatus = "running-active";
        if (live.countdownInterval) { clearInterval(live.countdownInterval); live.countdownInterval = null; }
        if (live.isAdmin) {
          liveEnterAdminMonitor(data);
        } else {
          liveEnterQuiz(data);
        }
      } else if (live.resultSubmitted) {
        liveCheckIfCanShowResults(data);
      }
      render();
      return;
    }

    if (status === "finished") {
      if (live.quizTimerInterval) { clearInterval(live.quizTimerInterval); live.quizTimerInterval = null; }
      if (live.monitorTimerInterval) { clearInterval(live.monitorTimerInterval); live.monitorTimerInterval = null; }
      if (!live.isAdmin && !live.resultSubmitted && lastHandledStatus !== "submitting") {
        // Čas vypršel dřív, než jsme stihli odeslat (např. admin uzavřel) — odešleme co máme.
        liveSubmitResult();
      }
      lastHandledStatus = "finished";
      state.view = "live";
      live.view = "results";
      render();
      return;
    }
  }

  // ---- Countdown before start ----
  function liveStartCountdownTicker(data) {
    if (live.countdownInterval) clearInterval(live.countdownInterval);
    live.countdownInterval = setInterval(() => {
      if (!live.sessionData) return;
      const startAt = live.sessionData.startAt;
      if (!startAt) return;
      const remainingMs = startAt - serverNow();
      if (remainingMs <= 0) {
        clearInterval(live.countdownInterval);
        live.countdownInterval = null;
        // Admin přepne status na running; účastníci jen čekají na update z DB.
        if (live.isAdmin) liveAdminMarkRunning();
      }
      updateLiveCountdownDisplay();
    }, 200);
  }

  function updateLiveCountdownDisplay() {
    const elNode = document.getElementById("live-countdown-number");
    if (!elNode || !live.sessionData || !live.sessionData.startAt) return;
    const remainingMs = Math.max(0, live.sessionData.startAt - serverNow());
    const remainingSec = Math.ceil(remainingMs / 1000);
    elNode.textContent = remainingSec > 0 ? String(remainingSec) : "0";
  }

  async function liveAdminMarkRunning() {
    const fb = getFb();
    if (!fb || !live.sessionId) return;
    try {
      const sRef = fb.ref(fb.db, `liveSessions/${live.sessionId}`);
      await fb.update(sRef, { status: "running" });
    } catch (err) {
      console.error("liveAdminMarkRunning error:", err);
    }
  }

  // ---- Admin monitor: admin nevyplňuje test, jen sleduje průběh účastníků ----
  function liveEnterAdminMonitor(data) {
    state.view = "live";
    live.view = "adminMonitor";
    setBreadcrumb([tr().liveEntryBtn, liveUnitTitle(data.unitKey)]);

    if (live.monitorTimerInterval) clearInterval(live.monitorTimerInterval);
    live.monitorAutoClosed = false;
    live.monitorTimerInterval = setInterval(() => {
      if (!live.sessionData) return;
      const endAt = live.sessionData.startAt + live.sessionData.durationSec * 1000;
      const remMs = Math.max(0, endAt - serverNow());
      updateLiveMonitorTimerDisplay(remMs);
      if (remMs <= 0 && !live.monitorAutoClosed) {
        live.monitorAutoClosed = true;
        clearInterval(live.monitorTimerInterval);
        live.monitorTimerInterval = null;
        // Čas vypršel — kolo se automaticky uzavře a výsledky se zobrazí všem.
        liveAdminCloseAndShowResults();
      }
    }, 250);

    render();
  }

  function updateLiveMonitorTimerDisplay(remMs) {
    const elNode = document.getElementById("live-monitor-time");
    if (!elNode) return;
    const totalSec = Math.ceil(remMs / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    elNode.textContent = `${m}:${s < 10 ? "0" : ""}${s}`;
  }

  // Vrátí název jednotky/verze pro zobrazení v breadcrumbu živého kola.
  // Podporuje jak staré klíče jednotek (QUESTION_DATA), tak nové klíče
  // verzí pro živé kolo (LIVE_QUESTION_BANKS).
  function liveUnitTitle(unitKey) {
    if (LIVE_QUESTION_BANKS[unitKey]) return LIVE_QUESTION_BANKS[unitKey].title[state.lang];
    if (QUESTION_DATA[unitKey]) return QUESTION_DATA[unitKey].title[state.lang];
    return unitKey;
  }

  // ---- Build local quiz state from session data, then run a normal quiz ----
  function liveBuildQuestionSet(data) {
    const bank = LIVE_QUESTION_BANKS[data.unitKey];
    let flatQuestions;
    if (bank) {
      flatQuestions = bank.questions.slice();
      // Session mohla obsahovat i otázky doplněné z běžné banky "procházet
      // otázky" (viz getLiveSessionQuestionSource), pokud banka pro živé kolo
      // sama o sobě neměla dost otázek (bank.qCount). Musíme je tu umět
      // dohledat podle id stejným způsobem, jinak zůstanou nenalezené a quiz
      // skončí s prázdným/neúplným seznamem otázek (a prázdnou obrazovkou).
      const baseUnitKey = baseUnitKeyForLiveBank(data.unitKey);
      if (QUESTION_DATA[baseUnitKey]) {
        flatQuestions = getAllQuestionsForUnit(baseUnitKey).concat(flatQuestions);
      }
    } else {
      const unit = QUESTION_DATA[data.unitKey];
      flatQuestions = unit ? getAllQuestionsForUnit(data.unitKey) : [];
    }
    const byId = {};
    flatQuestions.forEach(q => { byId[q.id] = q; });
    const seed = data.optionOrderSeed || 1;
    let seedCounter = seed;
    function seededRandom() {
      // jednoduchý deterministický PRNG (LCG), aby všichni účastníci viděli
      // otázky ve stejném pořadí možností odpovědí pro danou otázku
      seedCounter = (seedCounter * 9301 + 49297) % 233280;
      return seedCounter / 233280;
    }
    const list = [];
    (data.questionIds || []).forEach(qid => {
      const q = byId[qid];
      if (!q) return;
      const optionKeys = Object.keys(q.cz.options);
      const shuffled = optionKeys.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      list.push(Object.assign({}, q, { _optionOrder: shuffled }));
    });
    return list;
  }

  // ---- LocalStorage persistence for live answers (survives page refresh) ----
  function liveAnswersKey(sessionId) {
    return `usmle-live-answers-${sessionId}`;
  }
  function liveSaveAnswers(sessionId, answers) {
    try { localStorage.setItem(liveAnswersKey(sessionId), JSON.stringify(answers)); } catch (e) {}
  }
  function liveLoadAnswers(sessionId) {
    try {
      const raw = localStorage.getItem(liveAnswersKey(sessionId));
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function liveClearAnswers(sessionId) {
    try { localStorage.removeItem(liveAnswersKey(sessionId)); } catch (e) {}
  }

  // ---- LocalStorage persistence pro AKTIVNÍ session (survives page refresh) ----
  // Samotné odpovědi (viz výše) přežijí refresh, ale bez tohohle by klient po
  // refreshi vůbec nevěděl, do jaké session se má znovu připojit — takže by se
  // uložené odpovědi nikdy nepoužily. Uloží se sessionId + role hned po
  // úspěšném vstupu do session a smaže se při dobrovolném opuštění (liveTeardown).
  function liveSaveActiveSession(sessionId, isAdmin) {
    try { localStorage.setItem(ACTIVE_LIVE_SESSION_KEY, JSON.stringify({ sessionId, isAdmin: !!isAdmin })); }
    catch (e) {}
  }
  function liveLoadActiveSession() {
    try {
      const raw = localStorage.getItem(ACTIVE_LIVE_SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function liveClearActiveSession() {
    try { localStorage.removeItem(ACTIVE_LIVE_SESSION_KEY); } catch (e) {}
  }

  // Po refreshi stránky (nový load) zkusí obnovit rozpojenou live session:
  // nastaví live.sessionId/isAdmin z localStorage a znovu se napojí na Firebase
  // listener. Jakmile dorazí první snapshot, liveHandleSessionUpdate podle
  // stavu session zavolá liveEnterQuiz(), který mj. natáhne uložené odpovědi
  // přes liveLoadAnswers(). Spustí se jen jednou, po prvním fb-auth-ready.
  let liveAutoRejoinAttempted = false;
  function liveAttemptAutoRejoin() {
    if (liveAutoRejoinAttempted) return;
    liveAutoRejoinAttempted = true;
    if (live.sessionId) return; // uživatel už je v nějaké session (např. ?admin= odkaz)
    const saved = liveLoadActiveSession();
    if (!saved || !saved.sessionId) return;
    live.sessionId = saved.sessionId;
    live.isAdmin = !!saved.isAdmin;
    state.view = "live";
    live.view = "reconnecting";
    liveAttachSessionListener();
    render();
  }

  function liveEnterQuiz(data) {
    const questions = liveBuildQuestionSet(data);
    if (!questions.length) {
      console.error("liveEnterQuiz: no questions resolved for", data.unitKey, data.questionIds);
      liveTeardown();
      state.view = "live";
      live.view = "entry";
      liveSetError(tr().liveErrGeneric);
      render();
      return;
    }
    state.view = "quiz";
    state.mode = "live";
    state.unitKey = data.unitKey;
    state.chapterKey = null;
    state.questions = questions;

    // Obnovit odpovědi z localStorage (přežijí F5/refresh)
    const savedAnswers = liveLoadAnswers(live.sessionId);
    state.answers = savedAnswers;

    // Obnovit currentIndex na první nezodpovězenou otázku
    const savedCount = Object.keys(savedAnswers).length;
    state.currentIndex = Math.min(savedCount, questions.length - 1);
    const remainingMs = Math.max(0, (data.startAt + data.durationSec * 1000) - serverNow());
    state.timerSeconds = Math.ceil(remainingMs / 1000);
    setBreadcrumb([tr().liveEntryBtn, liveUnitTitle(data.unitKey)]);

    livePublishProgress();

    if (live.quizTimerInterval) clearInterval(live.quizTimerInterval);
    live.quizTimerInterval = setInterval(() => {
      const remMs = Math.max(0, (live.sessionData.startAt + live.sessionData.durationSec * 1000) - serverNow());
      state.timerSeconds = Math.ceil(remMs / 1000);
      updateTimerDisplay();
      if (remMs <= 0) {
        clearInterval(live.quizTimerInterval);
        live.quizTimerInterval = null;
        liveFinishLocalQuiz();
      }
    }, 250);

    render();
  }

  // Zapíše aktuální pozici účastníka (index otázky, počet odpovězeno) do Firebase,
  // aby to admin viděl živě na monitoru — bez nutnosti účastníka cokoliv odesílat.
  async function livePublishProgress() {
    if (live.isAdmin || !live.sessionId || !state.questions) return;
    try {
      const fb = getFb();
      const uid = await waitForAuthOrTimeout();
      if (!fb || !uid) return;
      const total = state.questions.length;
      const answered = Object.keys(state.answers || {}).length;
      const progressRef = fb.ref(fb.db, `liveSessions/${live.sessionId}/progress/${uid}`);
      await fb.update(progressRef, {
        currentIndex: state.currentIndex,
        answered,
        total,
        updatedAt: fb.serverTimestamp()
      });
    } catch (err) {
      console.error("livePublishProgress error:", err);
    }
  }

  // Voláno když lokálně dojde čas NEBO uživatel projde poslední otázku.
  function liveFinishLocalQuiz() {
    if (live.resultSubmitted) return;
    liveSubmitResult();
  }

  async function liveSubmitResult() {
    if (live.resultSubmitted) return;
    live.resultSubmitted = true;
    lastHandledStatus = "submitting";

    const total = state.questions.length;
    let correctCount = 0;
    Object.values(state.answers).forEach(a => { if (a.isCorrect) correctCount++; });
    const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

    try {
      const fb = getFb();
      const uid = await waitForAuthOrTimeout();
      if (fb && uid && live.sessionId) {
        const resultRef = fb.ref(fb.db, `liveSessions/${live.sessionId}/results/${uid}`);
        await fb.set(resultRef, {
          name: live.myName || "?",
          correct: correctCount,
          total,
          pct,
          submittedAt: fb.serverTimestamp()
        });
        const progressRef = fb.ref(fb.db, `liveSessions/${live.sessionId}/progress/${uid}`);
        await fb.update(progressRef, {
          currentIndex: total - 1,
          answered: total,
          total,
          done: true,
          updatedAt: fb.serverTimestamp()
        });
        // Smazat persistentní zálohu odpovědí — výsledky jsou v Firebase
        liveClearAnswers(live.sessionId);
      }
    } catch (err) {
      console.error("liveSubmitResult error:", err);
    }

    state.view = "live";
    // Pokud Firebase listener mezitím nastavil view na "results", nevrátíme se zpět na "waitingResults"
    if (live.view !== "results") {
      live.view = "waitingResults";
    }
    render();
    if (live.sessionData) liveCheckIfCanShowResults(live.sessionData);
  }

  // nextQuestion() v hlavní appce volá finishQuiz() po poslední otázce;
  // pro mode "live" finishQuiz musí místo zobrazení lokálních resultů odeslat
  // výsledek do Firebase. Ošetřeno přímo v patchnuté finishQuiz (viz níže).

  function liveCheckIfCanShowResults(data) {
    // Výsledky a percentil zobrazíme, jakmile je status "finished" (admin
    // uzavřel kolo), NEBO okamžitě u automatických kol (data.auto), protože
    // tam žádný admin není a čekat na "finished" by znamenalo čekat navždy.
    if (data && (data.status === "finished" || data.auto) && live.view !== "results") {
      live.view = "results";
      render();
    }
  }

  // ---- Admin lobby actions ----
  async function liveAdminStartCountdown() {
    const fb = getFb();
    if (!fb || !live.sessionId) return;
    try {
      const sRef = fb.ref(fb.db, `liveSessions/${live.sessionId}`);
      const COUNTDOWN_MS = 5000;
      const startAt = serverNow() + COUNTDOWN_MS;
      const durationSec = (live.sessionData && live.sessionData.durationSec) || TEST_DURATION_SEC;
      await fb.update(sRef, {
        status: "countdown",
        startAt,
        endAt: startAt + durationSec * 1000
      });
    } catch (err) {
      console.error("liveAdminStartCountdown error:", err);
      liveSetError(tr().liveErrGeneric);
    }
  }

  async function liveAdminCancelSession() {
    if (!window.confirm(tr().liveCancelConfirm)) return;
    const fb = getFb();
    if (!fb || !live.sessionId) return;
    try {
      const sRef = fb.ref(fb.db, `liveSessions/${live.sessionId}`);
      await fb.update(sRef, { status: "cancelled" });
    } catch (err) {
      console.error("liveAdminCancelSession error:", err);
    }
  }

  async function liveAdminCloseAndShowResults() {
    // Kolo se uzavře automaticky po vypršení času, nebo ho admin může
    // uzavřít manuálně dřív (např. všichni už odpověděli).
    if (live.monitorTimerInterval) { clearInterval(live.monitorTimerInterval); live.monitorTimerInterval = null; }
    live.monitorAutoClosed = true;
    const fb = getFb();
    if (!fb || !live.sessionId) return;
    try {
      const sRef = fb.ref(fb.db, `liveSessions/${live.sessionId}`);
      await fb.update(sRef, { status: "finished" });
    } catch (err) {
      console.error("liveAdminCloseAndShowResults error:", err);
    }
  }

  // ---- Percentile computation ----
  function computePercentile(myPct, allResults) {
    const scores = Object.values(allResults || {}).map(r => r.pct);
    const n = scores.length;
    if (n <= 1) return null;
    // Porovnáváme se jen s OSTATNÍMI účastníky (ne se sebou samým) — jinak by
    // i nejhorší možný výsledek vycházel na "lepší než 1/n účastníků" místo 0 %,
    // protože by se počítal i vlastní skóre v čitateli.
    let lower = 0;
    let equal = 0;
    scores.forEach(s => {
      if (s < myPct) lower++;
      else if (s === myPct) equal++;
    });
    equal = Math.max(0, equal - 1); // vynech sebe z počtu shodných skóre
    const others = n - 1;
    // Shodná skóre se počítají napůl (standardní percentilová konvence),
    // aby remíza nebyla ani plný "beat", ani plná "prohra".
    return Math.round(((lower + equal * 0.5) / others) * 100);
  }

      const isYou = uid === highlightUid;
      list.appendChild(el("span", {
        cls: "live-roster-chip" + (isYou ? " is-you" : ""),
        text: participants[uid].name + (isYou ? " (ty)" : "")
      }));
    });
    wrap.appendChild(list);
    return wrap;
  }

  function renderLiveLobbyAdmin() {
    const frag = el("div");
    const data = live.sessionData;
    if (!data) return renderLiveSpinner();

    const panel = el("div", { cls: "live-panel" });
    panel.appendChild(el("h1", { text: tr().liveAdminTitle }));

    const codeBlock = el("div", { cls: "live-code-display" });
    codeBlock.appendChild(el("div", { cls: "code-label", text: tr().liveCodeLabel }));
    codeBlock.appendChild(el("div", { cls: "code-value", text: data.code }));
    panel.appendChild(codeBlock);

    const copyRow = el("div", { cls: "live-actions" });
    copyRow.appendChild(el("button", {
      cls: "pill-btn",
      text: tr().liveCopyCode,
      onClick: async () => {
        try { await navigator.clipboard.writeText(data.code); } catch (e) {}
      }
    }));
    panel.appendChild(copyRow);

    panel.appendChild(renderParticipantRoster(data, live.uid));

    const err = liveErrorBox();
    if (err) panel.appendChild(err);

    const actions = el("div", { cls: "live-actions" });
    actions.appendChild(el("button", { cls: "pill-btn primary", text: tr().liveStartBtn, onClick: liveAdminStartCountdown }));
    actions.appendChild(el("button", { cls: "pill-btn danger", text: tr().liveCancelSessionBtn, onClick: liveAdminCancelSession }));
    panel.appendChild(actions);

    frag.appendChild(panel);
    return frag;
  }

  function renderLiveLobbyParticipant() {
    const frag = el("div");
    const data = live.sessionData;
    if (!data) return renderLiveSpinner();

    const panel = el("div", { cls: "live-panel" });
    panel.appendChild(el("h1", { text: tr().liveTitle }));

    const spinner = el("div", { cls: "live-spinner" });
    panel.appendChild(spinner);
    panel.appendChild(el("p", { cls: "live-waiting-msg", text: tr().liveWaitingForStart }));

    panel.appendChild(renderParticipantRoster(data, live.uid));

    frag.appendChild(panel);
    return frag;
  }

  function renderLiveCountdown() {
    const frag = el("div");
    const panel = el("div", { cls: "live-panel" });
    panel.appendChild(el("h1", { text: tr().liveStartingIn }));
    const num = el("div", { cls: "live-countdown-big", attrs: { id: "live-countdown-number" }, text: "…" });
    panel.appendChild(num);
    frag.appendChild(panel);
    return frag;
  }

  function renderLiveAdminMonitor() {
    const frag = el("div");
    const data = live.sessionData;
    if (!data) return renderLiveSpinner();

    const panel = el("div", { cls: "live-panel live-panel-wide" });
    panel.appendChild(el("h1", { text: tr().liveMonitorTitle }));

    const timerRow = el("p", { cls: "live-monitor-timer" });
    timerRow.appendChild(document.createTextNode(tr().liveMonitorTimeLeft + ":"));
    const timerVal = el("strong", { attrs: { id: "live-monitor-time" }, text: "…" });
    timerRow.appendChild(timerVal);
    panel.appendChild(timerRow);

    const totalQuestions = (data.questionIds || []).length;
    const participants = data.participants || {};
    const progress = data.progress || {};

    const list = el("div", { cls: "live-progress-list" });
    const names = Object.keys(participants);
    if (names.length === 0) {
      list.appendChild(el("p", { cls: "live-waiting-msg", text: tr().liveRosterTitle + ": 0" }));
    }
    names.forEach(uid => {
      const row = el("div", { cls: "live-progress-row" });
      row.appendChild(el("span", { cls: "live-progress-name", text: participants[uid].name }));

      const p = progress[uid];
      const answered = p ? p.answered : 0;
      const total = (p && p.total) || totalQuestions;
      const isDone = !!(p && p.done);
      const fillPct = total > 0 ? Math.round((answered / total) * 100) : 0;

      const barTrack = el("div", { cls: "live-progress-bar-track" });
      const barFill = el("div", { cls: "live-progress-bar-fill" + (isDone ? " is-done" : "") });
      barFill.style.width = fillPct + "%";
      barTrack.appendChild(barFill);
      row.appendChild(barTrack);

      let statusText;
      if (isDone) {
        statusText = tr().liveMonitorFinishedAnswers;
      } else if (!p) {
        statusText = tr().liveMonitorNotStarted;
      } else {
        statusText = tr().liveMonitorQuestionOf(Math.min(p.currentIndex + 1, total), total);
      }
      row.appendChild(el("span", { cls: "live-progress-status" + (isDone ? " is-done" : ""), text: statusText }));

      list.appendChild(row);
    });
    panel.appendChild(list);

    const err = liveErrorBox();
    if (err) panel.appendChild(err);

    const actions = el("div", { cls: "live-actions" });
    actions.appendChild(el("button", { cls: "pill-btn primary", text: tr().liveMonitorCloseNow, onClick: liveAdminCloseAndShowResults }));
    panel.appendChild(actions);

    panel.appendChild(el("p", { cls: "live-monitor-note", text: tr().liveMonitorAdminNote }));

    frag.appendChild(panel);
    return frag;
  }

  function renderLiveWaiting() {
    const frag = el("div");
    const panel = el("div", { cls: "live-panel" });
    panel.appendChild(el("h1", { text: tr().liveSessionEnded }));
    const spinner = el("div", { cls: "live-spinner" });
    panel.appendChild(spinner);
    panel.appendChild(el("p", { cls: "live-waiting-msg", text: tr().liveWaitingForOthers }));

    if (live.isAdmin) {
      const actions = el("div", { cls: "live-actions" });
      actions.appendChild(el("button", { cls: "pill-btn primary", text: tr().liveBackToHomeFinal, onClick: liveAdminCloseAndShowResults }));
      panel.appendChild(actions);
    }

    frag.appendChild(panel);
    return frag;
  }

  function renderLiveResults() {
    const frag = el("div");
    const data = live.sessionData;
    const card = el("div", { cls: "results-card" });

    const allResults = (data && data.results) || {};
    const participantCount = Object.keys(allResults).length;

    if (live.isAdmin) {
      // Admin nikdy test nevyplňoval — žádné vlastní skóre k zobrazení, jen souhrn kola.
      card.appendChild(el("div", { cls: "score-label", text: tr().liveResultsAdminTitle }));
      card.appendChild(el("div", { cls: "score", text: String(participantCount) }));
      card.appendChild(el("div", { cls: "score-label", text: tr().liveParticipants(participantCount) }));
    } else {
      const myResult = (data && data.results && live.uid) ? data.results[live.uid] : null;
      const correctCount = myResult ? myResult.correct : 0;
      const total = myResult ? myResult.total : (state.questions ? state.questions.length : 0);
      const pct = myResult ? myResult.pct : 0;

      card.appendChild(el("div", { cls: "score-label", text: tr().yourScore }));
      card.appendChild(el("div", { cls: "score", text: `${correctCount} / ${total}` }));
      card.appendChild(el("div", { cls: "score-label", text: `${pct}%` }));

      const percentile = myResult ? computePercentile(pct, allResults) : null;

      const pBlock = el("div", { cls: "percentile-block" });
      if (percentile !== null) {
        const pRow = el("div", { cls: "percentile-row" });
        pRow.appendChild(el("span", { cls: "percentile-number", text: `${percentile}.` }));
        pRow.appendChild(el("span", { cls: "percentile-label", text: tr().livePercentileBetterThan(percentile) }));
        pBlock.appendChild(pRow);

        const barWrap = el("div", { cls: "percentile-bar-wrap" });
        const track = el("div", { cls: "percentile-bar-track" });
        const fill = el("div", { cls: "percentile-bar-fill" });
        fill.style.width = percentile + "%";
        track.appendChild(fill);
        barWrap.appendChild(track);
        const meta = el("div", { cls: "percentile-bar-meta" });
        meta.appendChild(el("span", { text: "0" }));
        meta.appendChild(el("span", { text: tr().liveOf(participantCount) }));
        meta.appendChild(el("span", { text: "100" }));
        barWrap.appendChild(meta);
        pBlock.appendChild(barWrap);
      } else {
        pBlock.appendChild(el("p", { cls: "live-waiting-msg", text: tr().liveNoOtherResultsYet }));
      }
      card.appendChild(pBlock);
    }

    const actions = el("div", { cls: "results-actions" });
    actions.appendChild(el("button", { cls: "pill-btn primary", attrs: { "data-hw-back": "1" }, text: tr().backHome, onClick: goHome }));
    actions.appendChild(el("button", {
      cls: "pill-btn",
      text: tr().exportPdf,
      onClick: () => exportLiveResultsToPdf(live.isAdmin ? null : (data && data.results && live.uid ? data.results[live.uid] : null))
    }));
    card.appendChild(actions);
    if (participantCount > 0) {
      const lb = el("div", { cls: "live-leaderboard" });
      lb.appendChild(el("div", { cls: "live-leaderboard-title", text: tr().liveLeaderboardTitle }));
      const sorted = Object.keys(allResults)
        .map(uid => Object.assign({ uid }, allResults[uid]))
        .sort((a, b) => b.pct - a.pct || b.correct - a.correct);
      sorted.forEach((r, idx) => {
        const row = el("div", { cls: "lb-row" + (r.uid === live.uid ? " is-you" : "") });
        row.appendChild(el("span", { cls: "lb-rank", text: `#${idx + 1}` }));
        row.appendChild(el("span", { cls: "lb-name", text: r.name }));
        row.appendChild(el("span", { cls: "lb-score", text: `${r.correct}/${r.total} · ${r.pct}%` }));
        lb.appendChild(row);
      });
      card.appendChild(lb);
    }

    frag.appendChild(card);

    // Review otázek — pouze pro účastníky, pokud máme otázky v paměti
    if (!live.isAdmin && state.questions && state.questions.length > 0) {
      const reviewSection = el("div", { cls: "test-review" });
      reviewSection.appendChild(el("h2", { cls: "test-review-title", text: tr().testReviewTitle }));
      state.questions.forEach((q, idx) => {
        reviewSection.appendChild(renderTestReviewItem(q, idx));
      });
      frag.appendChild(reviewSection);
    }

    return frag;
  }

  // Export výsledků živého testu do PDF — využívá nativní tiskový dialog prohlížeče
  // ("Uložit jako PDF"), žádná externí knihovna není potřeba. Skryje hlavičku
  // a ovládací prvky pomocí @media print pravidel a ponechá jen kartu s výsledkem,
  // žebříček a souhrn odpovědí — přesně to, co účastník vidí na obrazovce.
  function exportLiveResultsToPdf(myResult) {
    const prevTitle = document.title;
    const datePart = new Date().toISOString().slice(0, 10);
    const namePart = (myResult && myResult.name) ? String(myResult.name).replace(/[^\p{L}\p{N}]+/gu, "-") : "vysledek";
    document.title = `zivy-test-${namePart}-${datePart}`;
    const restore = () => {
      document.title = prevTitle;
      window.removeEventListener("afterprint", restore);
    };
    window.addEventListener("afterprint", restore);
    window.print();
    // Fallback pro prohlížeče bez spolehlivé podpory afterprint
    setTimeout(restore, 3000);
  }

  function renderLiveCancelled() {
    const frag = el("div");
    const panel = el("div", { cls: "live-panel" });
    panel.appendChild(el("h1", { text: tr().liveSessionCancelled }));
    const actions = el("div", { cls: "live-actions" });
    actions.appendChild(el("button", { cls: "pill-btn primary", attrs: { "data-hw-back": "1" }, text: tr().backHome, onClick: goHome }));
    panel.appendChild(actions);
    frag.appendChild(panel);
    return frag;
  }

  function renderLiveSpinner() {
    const frag = el("div");
    const panel = el("div", { cls: "live-panel" });
    panel.appendChild(el("div", { cls: "live-spinner" }));
    frag.appendChild(panel);
    return frag;
  }

  // ============ ?admin=KOD v URL: pohodlný magický odkaz ============
  // Kód se pošle na server ke skutečnému ověření (viz liveSubmitAdminUnlock),
  // stejně jako při ručním zadání do políčka. Z URL se hned smaže, ať tam
  // nevisí v historii prohlížeče déle, než je nutné.
  (function autoAdminFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("admin");
      if (!code) return;
      params.delete("admin");
      const rest = params.toString();
      const newUrl = window.location.pathname + (rest ? "?" + rest : "") + window.location.hash;
      window.history.replaceState({}, "", newUrl);
      live.adminUnlockInput = code;
      liveSubmitAdminUnlock();
    } catch (e) { /* noop */ }
  })();

  // ============ ANDROID HARDWARE TLAČÍTKO ZPĚT ============
  // Aplikace normálně nepoužívá window.history, takže hardwarové tlačítko
  // "zpět" na Androidu nemá žádnou historii, do které by se dalo vrátit,
  // a Capacitor rovnou ukončí aplikaci. Řešení: při každém navigačním
  // přechodu (změně obrazovky) přidáme záznam do historie prohlížeče a na
  // "popstate" (tj. stisk hardwarového tlačítka zpět) simulujeme klik na
  // aktuálně zobrazený "← Zpět" prvek na obrazovce (má atribut
  // data-hw-back) – tím se použije úplně stejná logika návratu, jakou má
  // appka už pro klik myší/prstem. Pokud žádný takový prvek na obrazovce
  // není (např. domovská obrazovka nebo probíhající živý test, kde návrat
  // není žádoucí), nic se neudělá a další stisk tlačítka zpět už aplikaci
  // normálně minimalizuje/ukončí (standardní chování systému).
  let __hwBackSig = null;
  let __hwBackHandling = false;

  function hwBackSignature() {
    return [state.view, state.unitKey, state.chapterKey, state.mode, live.view, daily.view].join("|");
  }

  function syncHwBackHistory() {
    const sig = hwBackSignature();
    if (__hwBackHandling) {
      __hwBackSig = sig;
      return;
    }
    if (__hwBackSig === null) {
      __hwBackSig = sig;
      try { window.history.replaceState({ hwBackSig: sig }, ""); } catch (e) { /* noop */ }
      return;
    }
    if (sig !== __hwBackSig) {
      __hwBackSig = sig;
      try { window.history.pushState({ hwBackSig: sig }, ""); } catch (e) { /* noop */ }
    }
  }

  window.addEventListener("popstate", function () {
    // Nejprve zavřít případné modály/overlaye přes obrazovkou.
    const lightbox = document.getElementById("lightbox-overlay");
    if (lightbox) { closeLightbox(); return; }
    const qov = document.getElementById("qreport-overlay");
    if (qov) { qreportClose(); return; }

    // Jinak simulovat klik na viditelný "zpět" prvek aktuální obrazovky.
    const backEl = document.querySelector("[data-hw-back]");
    if (backEl) {
      __hwBackHandling = true;
      backEl.click();
      __hwBackHandling = false;
    }
    // Pokud žádný "zpět" prvek není (domů / uzamčená obrazovka živého
    // testu), necháme to být – appka se nenavrátí, ale zůstane funkční.
  });

  // ============ INIT ============
  render();
})();
</script>
