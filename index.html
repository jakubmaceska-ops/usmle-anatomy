<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USMLE Anatomy</title>

<!-- ============ PWA: manifest, ikony, theme ============ -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#fafafa">
<link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

<!-- iOS specifika: Apple Safari nečte manifest.webmanifest pro instalaci na plochu -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="USMLE Anatomy">

<style>
  :root {
    --bg: #fafafa;
    --bg-panel: #ffffff;
    --bg-hover: #f5f5f5;
    --bg-hover-strong: #f0f0f0;
    --ink: #1a1a1a;
    --ink-contrast: #ffffff;
    --ink-soft: #5a5a5a;
    --ink-faint: #9a9a9a;
    --line: #e2e2e2;
    --line-strong: #cfcfcf;
    --accent: #1a1a1a;
    --correct-bg: #e7f5ea;
    --correct-line: #2e8b4f;
    --correct-ink: #1d6334;
    --incorrect-bg: #fbeaea;
    --incorrect-line: #b13a3a;
    --incorrect-ink: #8a2a2a;
    --news-accent: #4a4a4a;
    --news-accent-bg: #f0f0f0;
    --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
    --radius: 3px;
  }

  body.dark-mode {
    --bg: #1e1e1e;
    --bg-panel: #2a2a2a;
    --bg-hover: #353535;
    --bg-hover-strong: #3d3d3d;
    --ink: #f0f0f0;
    --ink-contrast: #1a1a1a;
    --ink-soft: #c2c2c2;
    --ink-faint: #8a8a8a;
    --line: #404040;
    --line-strong: #545454;
    --accent: #f0f0f0;
    --correct-bg: #2e3a30;
    --correct-line: #5fa777;
    --correct-ink: #8fd4a4;
    --incorrect-bg: #3a2c2c;
    --incorrect-line: #b56a6a;
    --incorrect-ink: #e0a3a3;
    --news-accent: #c2c2c2;
    --news-accent-bg: #353535;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }

  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ============ HEADER ============ */
  header {
    border-bottom: 1px solid var(--line);
    background: var(--bg-panel);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    color: var(--ink);
  }

  .brand-text {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.2px;
  }

  .brand-text .thin {
    font-weight: 400;
    color: var(--ink-soft);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .breadcrumb {
    font-size: 13px;
    color: var(--ink-soft);
    font-family: var(--mono);
    letter-spacing: 0.3px;
    display: none;
  }

  @media (min-width: 720px) {
    .breadcrumb { display: block; }
  }

  .lang-toggle {
    display: flex;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    overflow: hidden;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  .lang-toggle button {
    border: none;
    background: var(--bg-panel);
    color: var(--ink-faint);
    padding: 8px 14px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.5px;
    transition: background 0.15s, color 0.15s;
  }

  .lang-toggle button.active {
    background: var(--ink);
    color: var(--ink-contrast);
  }

  .lang-toggle button:not(.active):hover {
    background: var(--line);
    color: var(--ink);
  }

  /* ============ MAIN ============ */
  main {
    flex: 1;
    width: 100%;
  }

 .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 24px 56px;
}

.container.container-wide {
    max-width: 1300px;
}

/* ==================== 4 RÁMEČKY ==================== */

@media (min-width: 1020px) {
  .unit-grid {
    grid-template-columns: 1.5fr 1.5fr 1.5fr 1.2fr;   /* Anatomie I,II,III + MENU */
  }
}

.box {
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 24px;
}

/* Pokud chceš stejnou výšku všech boxů */
.boxes {
    align-items: stretch;
}
  /* ============ HOME SCREEN ============ */
  .home-hero {
    text-align: center;
    margin-bottom: 56px;
    position: relative;
  }

  .home-hero svg.watermark {
    position: absolute;
    top: -20px;
    right: -40px;
    width: 180px;
    height: 180px;
    opacity: 0.05;
    z-index: 0;
    pointer-events: none;
    color: var(--ink);
  }

  @media (max-width: 720px) {
    .home-hero svg.watermark { display: none; }
  }

  .home-hero h1 {
    font-family: var(--serif);
    font-size: 38px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.3px;
  }

  .home-hero p.tag {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0;
  }

  .unit-grid {
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr;
  }

  .app-footer {
    text-align: center;
    font-size: 10px;
    line-height: 1;
    color: var(--ink-faint);
    padding: 16px 0;
  }

  @media (min-width: 640px) {
    .unit-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 1020px) {
    .unit-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .unit-card {
    border: 1px solid var(--line);
    background: var(--bg-panel);
    border-radius: var(--radius);
    padding: 28px 24px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    position: relative;
  }

  .unit-card:hover {
    border-color: var(--line-strong);
    transform: translateY(-2px);
  }

  .unit-card .unit-roman {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 2px;
    margin-bottom: 14px;
    display: block;
  }

  .unit-card h2 {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 16px;
  }

  .unit-card ul {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.9;
  }

  .unit-card ul li {
    border-top: 1px solid var(--line);
    padding-top: 7px;
    margin-top: 7px;
  }

  .unit-card ul li:first-child {
    border-top: none;
    margin-top: 0;
    padding-top: 0;
  }

  .unit-card-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 0 0 16px;
  }

  .unit-card-title-row h2 {
    margin: 0;
  }

  .news-badge-card {
    flex-shrink: 0;
  }

  /* ============ MODE GRID (Procházet / Test) ============ */
  .mode-grid {
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr;
  }

  @media (min-width: 640px) {
    .mode-grid { grid-template-columns: 1fr 1fr; }
  }

  .mode-card {
    border: 1px solid var(--line);
    background: var(--bg-panel);
    border-radius: var(--radius);
    padding: 36px 28px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }

  .mode-card:hover {
    border-color: var(--line-strong);
    transform: translateY(-2px);
  }

  .mode-card.disabled {
    cursor: default;
    opacity: 0.4;
  }

  .mode-card.disabled:hover {
    transform: none;
    border-color: var(--line);
  }

  .mode-icon {
    margin-bottom: 18px;
    color: var(--ink);
  }

  .mode-icon svg {
    width: 34px;
    height: 34px;
  }

  .mode-card h2 {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 10px;
  }

  .mode-desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0;
  }

  /* ============ CHAPTER LIST (inside unit) ============ */
  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 36px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .page-head h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 600;
    margin: 0;
  }

  .back-link {
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    letter-spacing: 0.3px;
    margin-bottom: 18px;
  }

  .back-link:hover { color: var(--ink); }

  .chapter-list {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-panel);
  }

  .chapter-row {
    display: grid;
    grid-template-columns: 1fr 100px 1fr;
    align-items: center;
    column-gap: 16px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.12s;
  }

  .chapter-row:last-child { border-bottom: none; }
  .chapter-row:hover { background: var(--bg-hover); }

  .chapter-row .ch-name {
    grid-column: 1;
    font-size: 15.5px;
    font-weight: 500;
  }

  .chapter-row .ch-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
  }

  .chapter-row.empty {
    cursor: default;
    opacity: 0.45;
  }

  .chapter-row.empty:hover { background: transparent; }

  .chapter-row-all {
    background-image: repeating-linear-gradient(
      135deg,
      rgba(26, 26, 26, 0.05) 0px,
      rgba(26, 26, 26, 0.05) 1.5px,
      transparent 1.5px,
      transparent 9px
    );
  }

  .chapter-row-all:hover { background-color: var(--bg-hover); }

  .chapter-row-all .ch-name {
    font-weight: 600;
  }

  .chapter-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
    margin-bottom: 28px;
  }

  /* ============ CHAPTER / SUBCHAPTER THUMBNAIL IMAGES ============ */
  .unit-card-li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .ch-thumb {
    grid-column: 2;
    justify-self: center;
    width: 100px;
    height: 60px;
    object-fit: contain;
    flex-shrink: 0;
    opacity: 0.95;
  }

  .chapter-body-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .chapter-body-left {
    flex: 1 1 auto;
    min-width: 220px;
  }

  .chapter-hero-img {
    flex-shrink: 0;
    max-width: 640px;
  }

  .chapter-hero-img img {
    width: 100%;
    height: auto;
    display: block;
    opacity: 0.9;
  }

  @media (max-width: 640px) {
    .chapter-hero-img {
      max-width: 320px;
      width: 82%;
      margin: 8px auto 0;
    }
  }

  .pill-btn {
    border: 1px solid var(--line-strong);
    background: var(--bg-panel);
    border-radius: 100px;
    padding: 7px 16px;
    font-size: 12.5px;
    font-family: var(--mono);
    letter-spacing: 0.3px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.12s;
  }

  .pill-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .pill-btn.primary {
    background: var(--ink);
    color: var(--ink-contrast);
    border-color: var(--ink);
  }

  .pill-btn.primary:hover { opacity: 0.85; }

  /* ============ SETTINGS SUBPAGES ============ */
  .settings-panel {
    border: 1px solid var(--line);
    background: var(--bg-panel);
    border-radius: var(--radius);
    padding: 32px 28px;
  }

  .settings-panel p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 0;
  }

  .settings-panel a {
    color: var(--ink);
    text-decoration: underline;
  }

  .about-app-text p {
    margin: 0 0 16px 0;
  }

  .about-app-text p:last-child {
    margin-bottom: 0;
  }

  .about-app-composition-wrap {
    margin-top: 24px;
  }

  .about-app-composition-wrap iframe {
    display: block;
    width: 100%;
    max-width: 700px;
    height: 400px;
    border: none;
    margin: 0 auto;
  }

  @media (max-width: 480px) {
    .about-app-composition-wrap iframe {
      height: 820px;
    }
  }

  .support-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 32px;
    margin-top: 24px;
  }

  .support-qr-wrap {
    text-align: center;
    margin-top: 0;
  }

  .support-qr {
    max-width: 280px;
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    cursor: zoom-in;
    display: inline-block;
  }

  .support-paypal-wrap {
    text-align: center;
  }

  .support-paypal-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 15px;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .support-paypal-link:hover {
    background: var(--line);
    transform: translateY(-1px);
  }

  .support-paypal-logo .pp-blue {
    color: #003087;
    font-weight: 800;
  }

  .support-paypal-logo .pp-lblue {
    color: #009cde;
    font-weight: 800;
  }

  /* ============ ADD QUESTION FORM ============ */
  .add-question-form {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .aq-intro {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0;
  }

  .aq-last-id {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: -8px 0 0 0;
    font-weight: 600;
    opacity: 0.85;
  }

  .aq-section-title {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    margin: 4px 0 -6px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }

  .add-question-form > .aq-section-title:first-of-type {
    border-top: none;
    padding-top: 0;
  }

  .aq-field {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .aq-label {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
  }

  .aq-select,
  .aq-input,
  .aq-textarea {
    font-family: var(--sans);
    font-size: 14.5px;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--bg-panel);
    color: var(--ink);
    width: 100%;
  }

  .aq-textarea {
    resize: vertical;
    line-height: 1.5;
  }

  .aq-select:focus,
  .aq-input:focus,
  .aq-textarea:focus {
    outline: none;
    border-color: var(--ink-soft);
  }

  /* ============ VYHLEDAT OTÁZKU ============ */
  .qsearch-panel {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .qsearch-help {
    font-size: 12.5px;
    color: var(--ink-faint);
    line-height: 1.6;
    margin: 2px 0 0;
  }

  .qsearch-help code {
    font-family: var(--mono);
    background: var(--bg-hover);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }

  .qsearch-checkbox-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px 22px;
  }

  .qsearch-checkbox {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14.5px;
    cursor: pointer;
    user-select: none;
  }

  .qsearch-checkbox input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .qsearch-checkbox-standalone {
    font-weight: 500;
  }

  .qsearch-note {
    font-size: 12.5px;
    color: var(--ink-faint);
    line-height: 1.5;
    margin: -8px 0 0;
  }

  .qsearch-actions {
    display: flex;
    justify-content: flex-start;
  }

  .qsearch-results {
    max-width: 640px;
    margin: 36px auto 0;
  }

  .qsearch-results-count {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  .qsearch-list .qsearch-row {
    display: block;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.12s;
  }

  .qsearch-list .qsearch-row:last-child { border-bottom: none; }
  .qsearch-list .qsearch-row:hover { background: var(--bg-hover); }

  .qsearch-row-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .qsearch-row-id {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    background: var(--bg-hover-strong);
    padding: 2px 7px;
    border-radius: 3px;
  }

  .qsearch-row-chapter {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .qsearch-row-imgicon {
    font-size: 13px;
    margin-left: auto;
  }

  .qsearch-row-snippet {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .aq-option-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 9px;
  }

  .aq-option-row input[type="radio"] {
    width: 16px;
    height: 16px;
    accent-color: var(--ink);
    cursor: pointer;
    flex-shrink: 0;
  }

  .aq-option-letter {
    font-family: var(--mono);
    font-weight: 700;
    width: 16px;
    flex-shrink: 0;
  }

  .aq-option-input {
    flex: 1;
  }

  .aq-image-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .aq-image-preview-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }

  .aq-image-preview {
    max-width: 120px;
    max-height: 120px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  video.aq-image-preview {
    max-width: 220px;
    background: #000;
  }

  .aq-remove-img {
    border: none;
    background: var(--bg-hover-strong);
    color: var(--ink);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }

  .aq-error {
    color: var(--incorrect-ink);
    font-size: 13px;
    min-height: 18px;
  }

  .aq-output-wrap {
    border-top: 1px solid var(--line);
    padding-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .aq-output-label {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .aq-output-textarea {
    font-family: var(--mono);
    font-size: 12px;
    padding: 14px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--bg-hover);
    color: var(--ink);
    white-space: pre;
    width: 100%;
  }

  .aq-note {
    font-size: 12.5px;
    color: var(--ink-faint);
    font-style: italic;
    margin: 0;
  }

  .theme-toggle {
    display: flex;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    overflow: hidden;
    width: max-content;
  }

  .theme-toggle button {
    border: none;
    background: var(--bg-panel);
    color: var(--ink-faint);
    padding: 10px 20px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.3px;
    transition: background 0.15s, color 0.15s;
  }

  .theme-toggle button.active {
    background: var(--ink);
    color: var(--ink-contrast);
  }

  .theme-toggle button:not(.active):hover {
    background: var(--line);
    color: var(--ink);
  }

  .ch-count-wrap {
    grid-column: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }

  .ch-progress {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.2px;
  }

  .chapter-progress-line {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: -4px 0 18px;
    letter-spacing: 0.2px;
  }

  .setting-block {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  .setting-title {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 8px;
  }

  .setting-desc {
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }

  .setting-block .theme-toggle {
    margin-bottom: 16px;
  }

  .setting-block.lang-setting-block {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
    margin-bottom: 28px;
  }

  .setting-block .lang-toggle {
    width: max-content;
  }

  .pill-btn.danger {
    color: var(--incorrect-ink);
    border-color: var(--incorrect-line);
  }

  .danger-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
  }

  .pill-btn.danger:hover {
    background: var(--incorrect-bg);
    color: var(--incorrect-ink);
    border-color: var(--incorrect-line);
  }

  /* ============ QUIZ / BROWSE VIEW ============ */
  .quiz-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .quiz-progress {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
  }

  .timer {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    padding: 6px 14px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    letter-spacing: 0.5px;
  }

  .timer.warning {
    border-color: var(--incorrect-line);
    color: var(--incorrect-ink);
    background: var(--incorrect-bg);
  }

  .question-card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 36px;
    margin-bottom: 20px;
    position: relative;
  }

  .fav-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-faint);
    transition: color 0.15s, background 0.15s;
  }

  .fav-btn:hover {
    background: var(--bg-hover);
    color: #e05a5a;
  }

  .fav-btn.active {
    color: #e05a5a;
  }

  .fav-btn svg {
    width: 22px;
    height: 22px;
    display: block;
  }

  .chapter-row-fav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.12s;
    gap: 12px;
  }

  .chapter-row-fav:last-child { border-bottom: none; }

  .chapter-row-fav:hover { background: var(--bg-hover); }

  .chapter-row-fav.empty { opacity: 0.45; cursor: default; }
  .chapter-row-fav.empty:hover { background: transparent; }

  .ch-name-fav {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    color: var(--ink);
  }

  .ch-name-fav svg {
    width: 16px;
    height: 16px;
    color: #e05a5a;
    flex-shrink: 0;
  }

  /* ============ AKTUALITY / NEWS ============ */
  .chapter-row-news {
    background: var(--news-accent-bg);
  }

  .chapter-row-news:hover {
    background: var(--bg-hover-strong);
  }

  .ch-name-news {
    grid-column: 1;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--ink);
  }

  .ch-name-news svg {
    width: 17px;
    height: 17px;
    color: var(--ink-soft);
    flex-shrink: 0;
  }

  .ch-name-icon {
    grid-column: 1;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15.5px;
    font-weight: 500;
  }

  .ch-name-icon svg {
    width: 17px;
    height: 17px;
    color: var(--ink-soft);
    flex-shrink: 0;
  }

  .news-badge {
    grid-column: 3;
    justify-self: end;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 100px;
    background: var(--ink-soft);
    color: var(--ink-contrast);
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
  }

  .news-feed {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .news-post {
    border: 1px solid var(--line);
    border-left: 3px solid var(--news-accent);
    background: var(--bg-panel);
    border-radius: var(--radius);
    padding: 24px 26px;
  }

  .news-post-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 12px;
  }

  .news-post-title {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    line-height: 1.35;
  }

  .news-post-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .news-post-body p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  .news-post-body p:last-child {
    margin-bottom: 0;
  }

  @media (max-width: 600px) {
    .news-post { padding: 20px 18px; }
    .news-post-head { flex-direction: column; align-items: flex-start; gap: 4px; }
  }

  @media (max-width: 600px) {
    .question-card { padding: 24px 18px; }
  }

  .q-number {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-faint);
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .q-stem {
    font-size: 16.5px;
    line-height: 1.65;
    margin-bottom: 28px;
    font-weight: 450;
  }

  .q-image-wrap {
    margin-bottom: 24px;
  }

  .q-image {
    display: block;
    max-width: 100%;
    max-height: 420px;
    margin: 0 auto;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    cursor: zoom-in;
    background: #000;
    /* Android WebView (unlike Chrome/TWA) treats <img> as draggable and
       shows a long-press "save image" callout by default. Either gesture
       can swallow the tap before our click handler ever fires. Turning
       both off lets the tap reach openLightbox() reliably. */
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    user-select: none;
    touch-action: manipulation;
  }

  video.q-image {
    cursor: default;
  }

  .q-image-source {
    text-align: center;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink-faint);
    margin-top: 8px;
    word-break: break-all;
  }

  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    cursor: zoom-out;
    padding: 24px;
  }

  .lightbox-overlay img,
  .lightbox-overlay video {
    max-width: 100%;
    max-height: 100%;
    border-radius: var(--radius);
  }

  .q-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .q-option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    font-size: 15px;
    line-height: 1.5;
  }

  .q-option:hover:not(.locked) {
    border-color: var(--ink);
    background: var(--bg-hover-strong);
  }

  .q-option .opt-letter {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--ink-faint);
    flex-shrink: 0;
    width: 18px;
  }

  .q-option.locked { cursor: default; }

  .q-option.correct {
    background: var(--correct-bg);
    border-color: var(--correct-line);
  }
  .q-option.correct .opt-letter { color: var(--correct-ink); }

  .q-option.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-line);
  }
  .q-option.incorrect .opt-letter { color: var(--incorrect-ink); }

  .q-option.reveal-correct-unselected {
    border-color: var(--correct-line);
    border-width: 2.5px;
  }

  .q-option.selected-neutral {
    border-color: var(--ink);
    background: var(--bg-hover-strong);
  }
  .q-option.selected-neutral .opt-letter { color: var(--ink); }

  .explanation {
    margin-top: 24px;
    padding: 18px 20px;
    background: var(--bg-hover);
    border-left: 3px solid var(--ink);
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink-soft);
    display: none;
  }

  .explanation.visible { display: block; }

  .explanation .exp-label {
    font-family: var(--mono);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--ink);
    font-weight: 700;
    display: block;
    margin-bottom: 8px;
  }

  /* ============ KOMENTÁŘE K OTÁZKÁM ============ */
  .comments-section {
    margin-top: 20px;
  }

  .comments-toggle-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13.5px;
    font-family: var(--sans);
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }

  .comments-toggle-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .comments-panel {
    margin-top: 14px;
    padding: 16px 18px;
    background: var(--bg-hover);
    border-radius: var(--radius);
  }

  .comments-empty {
    font-size: 13.5px;
    color: var(--ink-soft);
    padding: 8px 0 14px;
  }

  .comment-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }

  .comment-item:last-of-type { border-bottom: none; }

  .comment-item.comment-reply {
    margin-left: 22px;
    padding-left: 12px;
    border-left: 2px solid var(--line);
  }

  .comment-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .comment-author {
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
  }

  .comment-time {
    font-size: 11.5px;
    color: var(--ink-soft);
    font-family: var(--mono);
  }

  .comment-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .comment-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .comment-vote-btn,
  .comment-reply-btn,
  .comment-delete-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 4px 10px;
    font-size: 12px;
    font-family: var(--sans);
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }

  .comment-vote-btn:hover,
  .comment-reply-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .comment-vote-btn.active {
    border-color: var(--ink);
    color: var(--ink);
    font-weight: 700;
    background: var(--bg);
  }

  .comment-delete-btn {
    color: #b3352c;
    border-color: #b3352c;
    opacity: 0.75;
  }

  .comment-delete-btn:hover { opacity: 1; }

  .comment-report-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 4px 10px;
    font-size: 12px;
    font-family: var(--sans);
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
  }

  .comment-report-btn:hover {
    border-color: #b3352c;
    color: #b3352c;
  }

  .comment-report-btn.is-done {
    color: var(--ink-faint);
    border-color: var(--line);
    cursor: default;
  }

  .comment-report-btn.is-done:hover {
    color: var(--ink-faint);
    border-color: var(--line);
  }

  .comment-report-form {
    margin-top: 10px;
    padding: 10px 0 0 0;
  }

  .comment-report-thanks {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 8px;
  }

  /* ============ NAHLÁŠENÍ CHYBY V OTÁZCE ============ */
  .qreport-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 6px 14px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.12s, color 0.12s;
    white-space: nowrap;
  }

  .qreport-btn:hover {
    border-color: #b3352c;
    color: #b3352c;
  }

  .qreport-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 300;
  }

  .qreport-modal {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 620px;
    width: 100%;
    margin-bottom: 40px;
    position: relative;
  }

  .qreport-close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 24px;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px 8px;
  }

  .qreport-close-btn:hover { color: var(--ink); }

  .qreport-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
    padding-right: 30px;
  }

  .qreport-required { color: #b3352c; }

  .qreport-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 18px;
  }

  .qreport-proposed-heading {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    margin: 6px 0 -4px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  .qreport-error {
    font-size: 13px;
    color: #b3352c;
  }

  .qreport-thanks {
    font-size: 14.5px;
    color: var(--ink-soft);
    font-style: italic;
    padding: 10px 0 4px;
  }

  .qreport-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 4px;
  }

  .comment-form {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .comment-reply-form {
    margin-top: 10px;
    padding: 10px 0 0 0;
  }

  .comment-replying-to {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .comment-name-input,
  .comment-text-input {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    resize: vertical;
  }

  .comment-text-input { min-height: 44px; }

  .comment-name-input:focus,
  .comment-text-input:focus {
    outline: none;
    border-color: var(--ink);
  }

  .comment-error {
    font-size: 12.5px;
    color: #b3352c;
  }

  .comment-form-actions {
    display: flex;
    gap: 8px;
  }

  .comment-form-actions .pill-btn {
    padding: 8px 18px;
    font-size: 13px;
  }

  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
  }

  .next-btn {
    background: var(--ink);
    color: var(--ink-contrast);
    border: none;
    border-radius: var(--radius);
    padding: 13px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: opacity 0.12s;
    font-family: var(--sans);
  }

  .next-btn:hover { opacity: 0.85; }

  .next-btn:disabled {
    background: var(--line-strong);
    cursor: not-allowed;
  }

  /* ============ RESULTS ============ */
  .results-card {
    text-align: center;
    padding: 56px 32px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-panel);
  }

  .results-card .score {
    font-family: var(--serif);
    font-size: 56px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .results-card .score-label {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .results-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .results-breakdown {
    margin: 8px 0 32px;
    text-align: left;
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }

  .results-breakdown-title {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 14px;
    text-align: center;
  }

  .breakdown-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .breakdown-row:last-child {
    border-bottom: none;
  }

  .breakdown-name {
    color: var(--ink-soft);
  }

  .breakdown-count {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .breakdown-count.all-correct {
    color: var(--correct-ink);
  }

  .breakdown-count.has-mistakes {
    color: var(--incorrect-ink);
  }

  /* ============ TEST REVIEW ============ */
  .test-review {
    margin-top: 40px;
  }

  .test-review-title {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 28px;
  }

  .review-card {
    margin-bottom: 24px;
  }

  .review-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .review-head .q-number {
    margin-bottom: 0;
  }

  .review-status {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: var(--radius);
    white-space: nowrap;
  }

  .review-status.correct {
    color: var(--correct-ink);
    background: var(--correct-bg);
    border: 1px solid var(--correct-line);
  }

  .review-status.incorrect {
    color: var(--incorrect-ink);
    background: var(--incorrect-bg);
    border: 1px solid var(--incorrect-line);
  }

  .review-status.unanswered {

  const PROGRESS_KEY = "usmle-anatomy-progress";

  function loadProgress() {
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveProgressMap(map) {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(map)); }
    catch (e) {}
  }

  let progressMap = loadProgress(); // { [questionId]: true }

  function markQuestionDone(qid) {
    if (qid === undefined || qid === null) return;
    if (!progressMap[qid]) {
      progressMap[qid] = true;
      saveProgressMap(progressMap);
    }
  }

  function isQuestionDone(qid) {
    return !!progressMap[qid];
  }

  function setSaveProgress(enabled) {
    state.saveProgress = enabled;
    try { localStorage.setItem("usmle-anatomy-save-progress", enabled ? "1" : "0"); }
    catch (e) {}
    render();
  }

  function resetProgress() {
    progressMap = {};
    saveProgressMap(progressMap);
    render();
  }

  function resetFavorites() {
    favoritesMap = {};
    saveFavoritesMap(favoritesMap);
    render();
  }

  function countDone(questions) {
    let done = 0;
    questions.forEach(q => { if (isQuestionDone(q.id)) done++; });
    return done;
  }

    catch (e) {}
  }

  let favoritesMap = loadFavorites(); // { [questionId]: true }

  function toggleFavorite(qid) {
    if (favoritesMap[qid]) {
      delete favoritesMap[qid];
    } else {
      favoritesMap[qid] = true;
    }
    saveFavoritesMap(favoritesMap);
  }

  function isFavorite(qid) {
    return !!favoritesMap[qid];
  }

  function getFavoriteQuestionsForUnit(unitKey) {
    const unit = QUESTION_DATA[unitKey];
    let all = [];
    Object.keys(unit.chapters).forEach(chKey => {
      all = all.concat(unit.chapters[chKey].questions.filter(q => isFavorite(q.id)).map(q => ({ ...q, _chapterKey: chKey })));
    });
    return all;
  }

  function tr() { return t[state.lang]; }

  // ============ HELPERS ============
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Vrátí promíchané pořadí klíčů možností (a, b, c, ...) pro danou otázku
  function shuffleOptionKeys(q) {
    const optionsObj = (q.cz && q.cz.options) || (q.en && q.en.options) || {};
    return shuffle(Object.keys(optionsObj));
  }

  // Připraví pole otázek pro novou session: každé otázce přidá vlastní
  // (nově vygenerované) pořadí možností a volitelně promíchá i pořadí otázek.
  // Vytváří kopie objektů otázek, aby se nikdy nemutovala původní banka otázek.
  function prepareQuestionsForSession(list, opts) {
    opts = opts || {};
    let result = list.map(q => ({ ...q, _optionOrder: shuffleOptionKeys(q) }));
    if (opts.shuffleOrder !== false) result = shuffle(result);
    return result;
  }

  // Odvodí klíč "procházecí" jednotky (např. "anatomie_1") z klíče banky
  // pro živé kolo (např. "anatomie_1_verze_2").
  function baseUnitKeyForLiveBank(bankKey) {
    return String(bankKey || "").replace(/_verze_\d+$/, "");
  }

  // Sestaví zdrojové otázky pro živé kolo: primárně z banky daného kola,
  // a pokud jich je méně než požadovaný počet (bank.qCount), doplní JEN
  // chybějící počet otázkami z běžné banky "procházet otázky" pro danou
  // jednotku (bez duplicit podle id, náhodně vybrané).
  function getLiveSessionQuestionSource(unitKey, bank) {
    const primary = (bank && bank.questions) || [];
    const need = (bank && bank.qCount) || 0;
    if (primary.length >= need) return primary;

    const missing = need - primary.length;
    const usedIds = new Set(primary.map(q => q.id));
    const baseUnitKey = baseUnitKeyForLiveBank(unitKey);
    let extra = [];
    if (QUESTION_DATA[baseUnitKey]) {
      const browsePool = getAllQuestionsForUnit(baseUnitKey).filter(q => !usedIds.has(q.id));
      extra = shuffle(browsePool).slice(0, missing);
    }
    return primary.concat(extra);
  }

  function getAllQuestionsForUnit(unitKey) {
    const unit = QUESTION_DATA[unitKey];
    let all = [];
    Object.keys(unit.chapters).forEach(chKey => {
      all = all.concat(unit.chapters[chKey].questions.map(q => ({ ...q, _chapterKey: chKey })));
    });
    return all;
  }

  function getChapterQuestions(unitKey, chapterKey) {
    return QUESTION_DATA[unitKey].chapters[chapterKey].questions;
  }

  function chapterTitle(unitKey, chapterKey) {
    return QUESTION_DATA[unitKey].chapters[chapterKey].title[state.lang];
  }

  function unitTitle(unitKey) {
    return QUESTION_DATA[unitKey].title[state.lang];
  }

  function setBreadcrumb(parts) {
    document.getElementById("breadcrumb").textContent = parts.join("  /  ");
  }

  function stopTimer() {
    if (state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, "0");
    const s = (sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  // ============ DAILY CHALLENGE (denní výzva) ============
  // Seedovaný pseudonáhodný generátor: pro daný den (Pražský čas) a daný
  // okruh (Anatomie I / I+II / I+II+III) vygeneruje VŠEM uživatelům úplně
  // stejnou sadu 10 otázek (i pořadí možností), aniž by bylo potřeba cokoliv
  // ukládat na server předem — klíč je jen v tom, že "náhodné" pořadí je
  // ve skutečnosti deterministická funkce data + okruhu.
  function hashSeedString(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822519);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    h ^= h >>> 16;
    return h >>> 0;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seededShuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Klíč aktuálního dne v Pražském čase (shodný formát jako u automatických
  // živých testů), takže nová sada se automaticky vygeneruje po půlnoci SEČ/SELČ
  // bez ohledu na časové pásmo nastavené na zařízení uživatele.
  function getPragueDateKeyForDaily() {
    const p = getPragueNowParts();
    return `${p.year}${p.month}${p.date}`;
  }

  // Sestaví dnešní sadu DAILY_QUESTION_COUNT otázek pro daný okruh: sloučí
  // "procházecí" banky otázek zahrnutých jednotek, deterministicky (seed =
  // datum + okruh) je zamíchá a vezme prvních N. Stejným generátorem se
  // deterministicky zamíchá i pořadí možností u každé otázky.
  function getDailyQuestionSet(scope) {
    const dateKey = getPragueDateKeyForDaily();
    const rng = mulberry32(hashSeedString(`daily-${dateKey}-${scope.key}`));

    let pool = [];
    const seenIds = new Set();
    scope.units.forEach(unitKey => {
      if (!QUESTION_DATA[unitKey]) return;
      getAllQuestionsForUnit(unitKey).forEach(q => {
        const idKey = (q.id !== undefined && q.id !== null) ? q.id : JSON.stringify(q);
        if (seenIds.has(idKey)) return;
        seenIds.add(idKey);
        pool.push(q);
      });
    });

    const shuffledPool = seededShuffle(pool, rng);
    const selected = shuffledPool.slice(0, DAILY_QUESTION_COUNT);
    const prepared = selected.map(q => {
      const optionsObj = (q.cz && q.cz.options) || (q.en && q.en.options) || {};
      const orderKeys = seededShuffle(Object.keys(optionsObj), rng);
      return { ...q, _optionOrder: orderKeys };
    });

    return { dateKey, questions: prepared };
  }

  // ---- Lokální evidence "dnes už absolvováno" (hlavní pojistka proti opakování) ----
  function loadDailyDoneMap() {
    try {
      const raw = localStorage.getItem(DAILY_DONE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveDailyDoneMap(map) {
    try { localStorage.setItem(DAILY_DONE_KEY, JSON.stringify(map)); } catch (e) {}
  }

  function dailyDoneMapKey(dateKey, scopeKey) {
    return `${dateKey}_${scopeKey}`;
  }

  function isDailyDoneLocally(dateKey, scopeKey) {
    return !!loadDailyDoneMap()[dailyDoneMapKey(dateKey, scopeKey)];
  }

  function getDailyDoneResult(dateKey, scopeKey) {
    return loadDailyDoneMap()[dailyDoneMapKey(dateKey, scopeKey)] || null;
  }

  function markDailyDoneLocally(dateKey, scopeKey, result) {
    const map = loadDailyDoneMap();
    map[dailyDoneMapKey(dateKey, scopeKey)] = result;
    saveDailyDoneMap(map);

  async function dailyStartScope(scope) {
    if (daily.starting) return;
    const name = (daily.myName || "").trim();
    if (!name) {
      daily.error = tr().dailyErrNameRequired;
      render();
      return;
    }
    try { localStorage.setItem("usmle-live-name", name); } catch (e) {}
    daily.myName = name;

    const dateKey = getPragueDateKeyForDaily();

    // Hlavní (rychlá, offline) pojistka: pokud tenhle prohlížeč už dnes tenhle
    // okruh absolvoval, rovnou zobrazíme dnešní výsledek a žebříček.
    if (isDailyDoneLocally(dateKey, scope.key)) {
      dailyShowResultsForScope(scope);
      return;
    }

    daily.starting = true;
    daily.error = "";
    render();

    try {
      const fb = getFb();
      const uid = await waitForAuthOrTimeout();
      if (fb && uid) {
        // Doplňková kontrola proti Firebase — kdyby lokální záznam chyběl
        // (jiné zařízení nebo vymazaná data prohlížeče), ale výsledek už
        // odeslaný je, výzvu znovu nespustíme.
        const resultRef = fb.ref(fb.db, `dailyChallenge/${dateKey}/${scope.key}/results/${uid}`);
        const snap = await fb.get(resultRef);
        const existing = snap.val();
        if (existing) {
          markDailyDoneLocally(dateKey, scope.key, {
            correct: existing.correct,
            total: existing.total,
            elapsedMs: existing.elapsedMs,
            submittedAt: Date.now()
          });
          daily.starting = false;
          dailyShowResultsForScope(scope);
          return;
        }
      }
    } catch (err) {
      console.error("dailyStartScope check error:", err);
      // I bez ověření na serveru pokračujeme dál — lokální kontrola výše
      // zůstává hlavní ochranou proti opakovanému absolvování.
    }

    const setData = getDailyQuestionSet(scope);
    if (setData.questions.length < DAILY_QUESTION_COUNT) {
      daily.starting = false;
      daily.error = tr().dailyErrNotEnoughQuestions;
      render();
      return;
    }

    daily.starting = false;
    daily.scope = scope;
    daily.dateKey = setData.dateKey;
    daily.resultSubmitted = false;
    daily.myResult = null;
    daily.leaderboard = null;
    daily.startedAt = Date.now();
    daily.elapsedMs = 0;

    state.mode = "daily";
    state.unitKey = null;
    state.chapterKey = null;
    state.questions = setData.questions;
    state.currentIndex = 0;
    state.answers = {};
    state._isFavoritesBrowse = false;
    state.view = "quiz";
    setBreadcrumb([tr().dailyEntryBtn, tr()[scope.titleKey]]);

    dailyStartElapsedTimer();
    render();
  }

    if (daily.resultSubmitted) return;

    const total = state.questions.length;

    const scope = daily.scope;
    const dateKey = daily.dateKey;

    const localResult = { correct: correctCount, total, elapsedMs, submittedAt: Date.now() };
    daily.myResult = localResult;
    markDailyDoneLocally(dateKey, scope.key, localResult);
    daily.error = "";

    try {
      const fb = getFb();
      const uid = await waitForAuthOrTimeout();
      if (fb && uid) {
        const resultRef = fb.ref(fb.db, `dailyChallenge/${dateKey}/${scope.key}/results/${uid}`);

    state.view = "daily";

  // Escapuje řetězec pro použití v regexu, ale ponechává * a ? beze změny
  // (ty se řeší zvlášť níže jako wildcard/žolíkové znaky).
  function escapeRegexKeepWildcards(str) {
    return str.replace(/[.+^${}()|[\]\\]/g, "\\$&");
  }

  // Rozparsuje uživatelský vyhledávací dotaz na pole regulárních výrazů,
  // které musí v textu otázky být obsaženy.
  // Podporuje: "přesná fráze", * (libovolný počet znaků),
  // ? (právě jeden znak). Více slov oddělených mezerou = logické A.
  function parseSearchKeywordQuery(raw) {
    const include = [];
    const tokenRe = /"([^"]+)"|(\S+)/g;
    let m;
    while ((m = tokenRe.exec(raw)) !== null) {
      const quoted = m[1] !== undefined;
      let text = quoted ? m[1] : m[2];
      if (!text) continue;
      let pattern = escapeRegexKeepWildcards(text);
      if (!quoted) {
        pattern = pattern.replace(/\*/g, ".*").replace(/\?/g, ".");
      }
      const rx = new RegExp(pattern, "i");
      include.push(rx);
    }
    return { include };
  }

  function questionSearchHaystack(q) {
    const qData = q[state.lang];
    if (!qData) return "";
    const optionsText = qData.options ? Object.values(qData.options).join(" ") : "";
    return [qData.stem || "", optionsText, qData.explanation || ""].join(" \n ");
  }

  function runQuestionSearch() {
    const raw = String(search.query || "").trim();
    const isIdSearch = /^\d+$/.test(raw);

    let pool = [];
    // Běžné jednotky (anatomie_1/2/3) — otázky se berou z QUESTION_DATA.
    Object.keys(search.units).filter(uk => uk !== "zive_testy" && search.units[uk]).forEach(uk => {
      const unit = QUESTION_DATA[uk];
      if (!unit) return;
      Object.keys(unit.chapters).forEach(chKey => {
        if (search.chapterFilter && search.chapterFilter !== `${uk}::${chKey}`) return;
        unit.chapters[chKey].questions.forEach(q => {
          if (q.id === undefined || q.id === null) return;
          pool.push(Object.assign({}, q, { _unitKey: uk, _chapterKey: chKey }));
        });
      });
    });

    // Otázky živých testů (ID >= 10 000) žijí v samostatném objektu
    // LIVE_QUESTION_BANKS (ne v QUESTION_DATA), a nemají podkapitoly —
    // proto se přidávají zvlášť a jen když je zaškrtnuté "Živé testy"
    // (dostupné jen po přihlášení admina) a není aktivní filtr na
    // konkrétní podkapitolu (ten se na živé testy nevztahuje).
    // Pozn.: klíč banky může mít u verzovaných kol tvar "anatomie_1_verze_2"
    // (viz baseUnitKeyForLiveBank), který v QUESTION_DATA neexistuje —
    // proto se pro zobrazení jednotky/název převádí na základní klíč jednotky.
    if (search.units.zive_testy && live.isAdminUnlocked && !search.chapterFilter &&
        typeof LIVE_QUESTION_BANKS !== "undefined" && LIVE_QUESTION_BANKS) {
      Object.keys(LIVE_QUESTION_BANKS).forEach(bankKey => {
        const bank = LIVE_QUESTION_BANKS[bankKey];
        const questions = (bank && bank.questions) || [];
        const baseUnitKey = baseUnitKeyForLiveBank(bankKey);
        const resolvedUnitKey = QUESTION_DATA[baseUnitKey] ? baseUnitKey : null;
        if (!resolvedUnitKey) return; // banka bez rozpoznatelné jednotky — přeskočit, ať appka nepadá při dalším procházení
        questions.forEach(q => {
          if (q.id === undefined || q.id === null) return;
          pool.push(Object.assign({}, q, { _unitKey: resolvedUnitKey, _chapterKey: null, _liveBankKey: bankKey }));
        });
      });
    }

    if (search.hasImageOnly) {
      pool = pool.filter(q => q.image && q.image.key);
    }

    let results;
    if (isIdSearch) {
      const idNum = parseInt(raw, 10);
      results = pool.filter(q => q.id === idNum);
    } else if (raw) {
      const parsed = parseSearchKeywordQuery(raw);
      results = pool.filter(q => {
        const haystack = questionSearchHaystack(q);
        return parsed.include.every(rx => rx.test(haystack));
      });
    } else {
      results = pool;
    }

    results.sort((a, b) => a.id - b.id);
    search.results = results;
    search.hasSearched = true;
    render();
  }

  // Otevře nalezenou otázku v běžném prohlížecím režimu, se všemi ostatními

  function selectAnswer(letter) {
    const idx = state.currentIndex;
    // V živém testu, v denní výzvě i v testu 30 otázek lze odpověď kdykoliv změnit
    // (dokud se nepřejde dál); jinde (browse) je po odpovědi zamčeno.
    if (state.answers[idx] && state.mode !== "live" && state.mode !== "daily" && state.mode !== "test") return; // already answered, locked
    const q = state.questions[idx];
    const qData = q[state.lang];
    const isCorrect = letter === qData.correct;
    state.answers[idx] = { selected: letter, isCorrect };
    if (state.saveProgress && state.mode === "browse") {
      markQuestionDone(q.id);
    }
    if (state.mode === "live") {
      // Persistovat odpovědi do localStorage — přežijí refresh stránky

      livePublishProgress();

    render();

  function el(tag, opts = {}) {
    const node = document.createElement(tag);
    if (opts.cls) node.className = opts.cls;
    if (opts.text) node.textContent = opts.text;
    if (opts.html) node.innerHTML = opts.html;
    if (opts.attrs) Object.entries(opts.attrs).forEach(([k, v]) => node.setAttribute(k, v));
    if (opts.onClick) node.addEventListener("click", opts.onClick);
    if (opts.children) opts.children.forEach(c => c && node.appendChild(c));
    return node;
  }

  // Escapuje HTML speciální znaky, aby text z dat (stem, options, ...) nemohl
  // vložit vlastní značky při vykreslování přes innerHTML.
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // Formátuje zadání otázky (stem) pro bezpečné vykreslení přes innerHTML:
  // - každý řádek (oddělený \n v datech) se zalomí na nový řádek (<br>)
  // - řádek začínající označením "A – ...", "B - ..." apod. se tučně zvýrazní
  function formatStemHtml(text) {
    return String(text)
      .split("\n")
      .map(line => {
        const escaped = escapeHtml(line);
        return escaped.replace(/^([A-Za-z0-9]{1,2})(\s*[–-]\s*)/, "<strong>$1</strong>$2");
      })
      .join("<br>");
  }

  function getMaxQuestionId() {
    let max = 0;
    Object.keys(QUESTION_DATA).forEach(unitKey => {
      const unit = QUESTION_DATA[unitKey];
      if (!unit.chapters) return;
      Object.keys(unit.chapters).forEach(chKey => {
        unit.chapters[chKey].questions.forEach(q => {
          if (typeof q.id === "number" && q.id > max) max = q.id;
        });
      });
    });
    return max;
  }

  // Najde nejvyšší ID mezi otázkami živého testu (banky v LIVE_QUESTION_BANKS,
  // číslované od 10 000 výš). Vrací null, pokud zatím žádná taková otázka neexistuje
  // nebo pokud banky ještě nejsou načtené (questions.js).
  function getMaxLiveQuestionId() {
    if (typeof LIVE_QUESTION_BANKS === "undefined" || !LIVE_QUESTION_BANKS) return null;
    let max = null;
    Object.keys(LIVE_QUESTION_BANKS).forEach(bankKey => {
      const bank = LIVE_QUESTION_BANKS[bankKey];
      const questions = (bank && bank.questions) || [];
      questions.forEach(q => {
        if (typeof q.id === "number" && q.id >= 10000 && (max === null || q.id > max)) max = q.id;
      });
    });
    return max;
  }

  function renderAddQuestionForm() {
    const wrap = el("div", { cls: "add-question-form" });
    wrap.appendChild(el("p", { cls: "aq-intro", text: tr().addQuestionIntro }));

    const lastIdNum = getMaxQuestionId();
    const lastIdTemplate = tr().addQuestionLastId || "Poslední přidaná otázka má číslo {id} (další nová otázka dostane číslo {nextId}).";
    const lastIdText = lastIdTemplate.replace("{id}", lastIdNum).replace("{nextId}", lastIdNum + 1);
    wrap.appendChild(el("p", { cls: "aq-last-id", text: lastIdText }));

    const lastLiveIdNum = getMaxLiveQuestionId();
    let lastLiveIdText;
    if (lastLiveIdNum === null) {
      lastLiveIdText = tr().addQuestionLastLiveIdNone || "Zatím nebyla přidána žádná otázka živého testu (první dostane číslo 10000).";
    } else {
      const lastLiveIdTemplate = tr().addQuestionLastLiveId || "Poslední přidaná otázka živého testu má číslo {id} (další nová otázka dostane číslo {nextId}).";
      lastLiveIdText = lastLiveIdTemplate.replace("{id}", lastLiveIdNum).replace("{nextId}", lastLiveIdNum + 1);
    }
    wrap.appendChild(el("p", { cls: "aq-last-id aq-last-live-id", text: lastLiveIdText }));

    // -- samotný formulář pro přidání otázky je dostupný jen po přihlášení
    // admina (stejné ověřené admin přihlášení jako u živého testu — sdílený
    // stav live.isAdminUnlocked, nastavovaný podle "admin" claimu v Firebase
    // ID tokenu, viz "fb-auth-ready" listener výše). Čísla otázek nad touto
    // hranicí zůstávají viditelná pro všechny.
    if (!live.isAdminUnlocked) {
      if (!live.showAdminUnlock) {
        wrap.appendChild(el("a", { cls: "live-admin-toggle", text: tr().liveAdminUnlockLink, onClick: liveOpenAdminUnlock }));
      } else {
        const unlockBox = el("div", { cls: "live-field live-admin-unlock-box" });
        unlockBox.appendChild(el("label", { text: tr().liveAdminUnlockLabel }));
        const pwInput = el("input", {
          attrs: { type: "password", placeholder: tr().liveAdminUnlockPh, autocomplete: "off" }
        });
        pwInput.value = live.adminUnlockInput || "";
        pwInput.disabled = !!live.adminUnlockChecking;
        pwInput.addEventListener("input", () => { live.adminUnlockInput = pwInput.value; });
        pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !live.adminUnlockChecking) liveSubmitAdminUnlock(); });
        unlockBox.appendChild(pwInput);

        if (live.adminUnlockError) {
          unlockBox.appendChild(el("div", { cls: "live-error", text: live.adminUnlockError }));
        }

        const unlockActions = el("div", { cls: "live-actions" });
        const unlockBtn = el("button", {
          cls: "pill-btn primary",
          text: live.adminUnlockChecking ? tr().liveAdminUnlockChecking : tr().liveAdminUnlockBtn,
          onClick: live.adminUnlockChecking ? () => {} : liveSubmitAdminUnlock
        });
        if (live.adminUnlockChecking) unlockBtn.disabled = true;
        unlockActions.appendChild(unlockBtn);
        unlockActions.appendChild(el("button", { cls: "pill-btn", text: tr().liveAdminUnlockCancel, onClick: liveCloseAdminUnlock }));
        unlockBox.appendChild(unlockActions);

        wrap.appendChild(unlockBox);
      }
      return wrap;
    }

    wrap.appendChild(el("a", { cls: "live-admin-toggle", text: tr().liveAdminLock, onClick: liveLockAdmin }));

    // -- unit + chapter selects --
    const unitKeys = Object.keys(QUESTION_DATA).filter(k => k !== "nastaveni");

    const unitField = el("div", { cls: "aq-field" });
    unitField.appendChild(el("label", { cls: "aq-label", text: tr().fieldUnit }));
    const unitSelect = el("select", { cls: "aq-select" });
    unitKeys.forEach(uk => {
      const opt = el("option", { text: QUESTION_DATA[uk].title[state.lang] });
      opt.value = uk;
      unitSelect.appendChild(opt);
    });
    unitField.appendChild(unitSelect);
    wrap.appendChild(unitField);

    const chapterField = el("div", { cls: "aq-field" });
    chapterField.appendChild(el("label", { cls: "aq-label", text: tr().fieldChapter }));
    const chapterSelect = el("select", { cls: "aq-select" });
    chapterField.appendChild(chapterSelect);
    wrap.appendChild(chapterField);

    function populateChapters() {
      chapterSelect.innerHTML = "";
      const chapters = QUESTION_DATA[unitSelect.value].chapters;
      Object.keys(chapters).forEach(ck => {
        const opt = el("option", { text: chapters[ck].title[state.lang] });
        opt.value = ck;
        chapterSelect.appendChild(opt);
      });
    }
    populateChapters();
    unitSelect.addEventListener("change", populateChapters);

    // -- CZ section heading --
    wrap.appendChild(el("h3", { cls: "aq-section-title", text: tr().sectionCzTitle }));

    // -- stem (CZ) --
    const stemField = el("div", { cls: "aq-field" });
    stemField.appendChild(el("label", { cls: "aq-label", text: tr().fieldStem }));
    const stemInput = el("textarea", {
      cls: "aq-textarea",
      attrs: { rows: "4", placeholder: tr().fieldStemPlaceholder }
    });
    stemField.appendChild(stemInput);
    wrap.appendChild(stemField);

    // -- options a-e (CZ) + correct-answer selector (shared for both languages) --
    const optionsField = el("div", { cls: "aq-field" });
    optionsField.appendChild(el("label", { cls: "aq-label", text: tr().fieldOptions }));
    const letters = ["a", "b", "c", "d", "e"];
    const optionInputs = {};
    letters.forEach(letter => {
      const row = el("div", { cls: "aq-option-row" });
      const radio = el("input", { attrs: { type: "radio", name: "aq-correct" } });
      radio.value = letter;
      const letterLabel = el("span", { cls: "aq-option-letter", text: letter.toUpperCase() });
      const textInput = el("input", {
        cls: "aq-input aq-option-input",
        attrs: { type: "text", placeholder: tr().fieldOptionPlaceholder(letter.toUpperCase()) }
      });
      optionInputs[letter] = { radio, textInput };
      row.appendChild(radio);
      row.appendChild(letterLabel);
      row.appendChild(textInput);
      optionsField.appendChild(row);
    });
    wrap.appendChild(optionsField);

    // -- explanation (CZ) --
    const explField = el("div", { cls: "aq-field" });
    explField.appendChild(el("label", { cls: "aq-label", text: tr().fieldExplanation }));
    const explInput = el("textarea", {
      cls: "aq-textarea",
      attrs: { rows: "4", placeholder: tr().fieldExplanationPlaceholder }
    });
    explField.appendChild(explInput);
    wrap.appendChild(explField);

    // -- image / video (optional, shared for both languages) --
    let imageDataUrl = null;
    let imageMediaType = "image"; // "image" | "video"
    const VIDEO_EXT_RE = /\.(ogv|ogg|webm|mp4|mov)$/i;
    const imageField = el("div", { cls: "aq-field" });
    imageField.appendChild(el("label", { cls: "aq-label", text: tr().fieldImage }));
    const imageInput = el("input", {
      attrs: {
        type: "file",
        accept: "image/png,image/jpeg,image/webp,video/mp4,video/webm,video/ogg,.ogv,.ogg,.mp4,.webm,.mov"
      }
    });
    const imagePreviewWrap = el("div", { cls: "aq-image-preview-wrap" });
    imageField.appendChild(imageInput);
    imageField.appendChild(imagePreviewWrap);
    wrap.appendChild(imageField);

    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      imagePreviewWrap.innerHTML = "";
      if (!file) { imageDataUrl = null; return; }
      const isVideo = (file.type && file.type.startsWith("video/")) || VIDEO_EXT_RE.test(file.name || "");
      imageMediaType = isVideo ? "video" : "image";
      const reader = new FileReader();
      reader.onload = () => {
        imageDataUrl = reader.result;
        const previewEl = isVideo
          ? el("video", {
              cls: "aq-image-preview",
              attrs: { src: imageDataUrl, controls: "controls", muted: "muted" }
            })
          : el("img", { cls: "aq-image-preview", attrs: { src: imageDataUrl, alt: "" } });
        const removeBtn = el("button", {
          cls: "aq-remove-img",
          text: "×",
          onClick: () => {
            imageDataUrl = null;
            imageInput.value = "";
            imagePreviewWrap.innerHTML = "";
          }
        });
        imagePreviewWrap.appendChild(previewEl);
        imagePreviewWrap.appendChild(removeBtn);
      };
      reader.readAsDataURL(file);
    });

    // -- image source (optional, shared for both languages) --
    const sourceField = el("div", { cls: "aq-field" });
    sourceField.appendChild(el("label", { cls: "aq-label", text: tr().fieldImageSource }));
    const sourceInput = el("input", {
      cls: "aq-input",
      attrs: { type: "text", placeholder: tr().fieldImageSourcePlaceholder }
    });
    sourceField.appendChild(sourceInput);
    wrap.appendChild(sourceField);

    // -- EN section heading --
    wrap.appendChild(el("h3", { cls: "aq-section-title", text: tr().sectionEnTitle }));

    // -- stem (EN) --
    const stemFieldEn = el("div", { cls: "aq-field" });
    stemFieldEn.appendChild(el("label", { cls: "aq-label", text: tr().fieldStemEn }));
    const stemInputEn = el("textarea", {
      cls: "aq-textarea",
      attrs: { rows: "4", placeholder: tr().fieldStemEnPlaceholder }
    });
    stemFieldEn.appendChild(stemInputEn);
    wrap.appendChild(stemFieldEn);

    // -- options a-e (EN) — same correct letter as CZ, just translated text --
    const optionsFieldEn = el("div", { cls: "aq-field" });
    optionsFieldEn.appendChild(el("label", { cls: "aq-label", text: tr().fieldOptionsEn }));
    const optionInputsEn = {};
    letters.forEach(letter => {
      const row = el("div", { cls: "aq-option-row" });
      const letterLabel = el("span", { cls: "aq-option-letter", text: letter.toUpperCase() });
      const textInput = el("input", {
        cls: "aq-input aq-option-input",
        attrs: { type: "text", placeholder: tr().fieldOptionPlaceholderEn(letter.toUpperCase()) }
      });
      optionInputsEn[letter] = { textInput };
      row.appendChild(letterLabel);
      row.appendChild(textInput);
      optionsFieldEn.appendChild(row);
    });
    wrap.appendChild(optionsFieldEn);

    // -- explanation (EN) --
    const explFieldEn = el("div", { cls: "aq-field" });
    explFieldEn.appendChild(el("label", { cls: "aq-label", text: tr().fieldExplanationEn }));
    const explInputEn = el("textarea", {
      cls: "aq-textarea",
      attrs: { rows: "4", placeholder: tr().fieldExplanationEnPlaceholder }
    });
    explFieldEn.appendChild(explInputEn);
    wrap.appendChild(explFieldEn);

    // -- explanation image / video (optional, shared for both languages) --
    let explImageDataUrl = null;
    let explImageMediaType = "image"; // "image" | "video"
    const explImageField = el("div", { cls: "aq-field" });
    explImageField.appendChild(el("label", { cls: "aq-label", text: tr().fieldExplanationImage }));
    const explImageInput = el("input", {
      attrs: {
        type: "file",
        accept: "image/png,image/jpeg,image/webp,video/mp4,video/webm,video/ogg,.ogv,.ogg,.mp4,.webm,.mov"
      }
    });
    const explImagePreviewWrap = el("div", { cls: "aq-image-preview-wrap" });
    explImageField.appendChild(explImageInput);
    explImageField.appendChild(explImagePreviewWrap);
    wrap.appendChild(explImageField);

    explImageInput.addEventListener("change", () => {
      const file = explImageInput.files && explImageInput.files[0];
      explImagePreviewWrap.innerHTML = "";
      if (!file) { explImageDataUrl = null; return; }
      const isVideo = (file.type && file.type.startsWith("video/")) || VIDEO_EXT_RE.test(file.name || "");
      explImageMediaType = isVideo ? "video" : "image";
      const reader = new FileReader();
      reader.onload = () => {
        explImageDataUrl = reader.result;
        const previewEl = isVideo
          ? el("video", {
              cls: "aq-image-preview",
              attrs: { src: explImageDataUrl, controls: "controls", muted: "muted" }
            })
          : el("img", { cls: "aq-image-preview", attrs: { src: explImageDataUrl, alt: "" } });
        const removeBtn = el("button", {
          cls: "aq-remove-img",
          text: "×",
          onClick: () => {
            explImageDataUrl = null;
            explImageInput.value = "";
            explImagePreviewWrap.innerHTML = "";
          }
        });
        explImagePreviewWrap.appendChild(previewEl);
        explImagePreviewWrap.appendChild(removeBtn);
      };
      reader.readAsDataURL(file);
    });

    // -- explanation image source (optional, shared for both languages) --
    const explSourceField = el("div", { cls: "aq-field" });
    explSourceField.appendChild(el("label", { cls: "aq-label", text: tr().fieldExplanationImageSource }));
    const explSourceInput = el("input", {
      cls: "aq-input",
      attrs: { type: "text", placeholder: tr().fieldExplanationImageSourcePlaceholder }
    });
    explSourceField.appendChild(explSourceInput);
    wrap.appendChild(explSourceField);

    // -- error message --
    const errorMsg = el("div", { cls: "aq-error" });
    wrap.appendChild(errorMsg);

    // -- output (hidden until generated) --
    const outputWrap = el("div", { cls: "aq-output-wrap" });
    outputWrap.style.display = "none";
    const outputLabel = el("div", { cls: "aq-output-label", text: tr().generatedCodeLabel });
    const outputArea = el("textarea", {
      cls: "aq-output-textarea",
      attrs: { rows: "16", readonly: "readonly", spellcheck: "false" }
    });
    const copyBtn = el("button", {
      cls: "pill-btn",
      text: tr().copyBtn,
      onClick: () => {
        outputArea.select();
        if (navigator.clipboard) {
          navigator.clipboard.writeText(outputArea.value).catch(() => {});
        }
        copyBtn.textContent = tr().copiedMsg;
        setTimeout(() => { copyBtn.textContent = tr().copyBtn; }, 1500);
      }
    });
    outputWrap.appendChild(outputLabel);
    outputWrap.appendChild(outputArea);
    outputWrap.appendChild(copyBtn);
    wrap.appendChild(outputWrap);

    // -- generate button --
    const generateBtn = el("button", {
      cls: "pill-btn primary",
      text: tr().generateBtn,
      onClick: () => {
        errorMsg.textContent = "";

        const stemText = stemInput.value.trim();
        const explText = explInput.value.trim();
        const optionTexts = {};
        letters.forEach(l => { optionTexts[l] = optionInputs[l].textInput.value.trim(); });
        const correctLetter = letters.find(l => optionInputs[l].radio.checked);

        const stemTextEn = stemInputEn.value.trim();
        const explTextEn = explInputEn.value.trim();
        const optionTextsEn = {};
        letters.forEach(l => { optionTextsEn[l] = optionInputsEn[l].textInput.value.trim(); });

        const czValid = stemText && explText && correctLetter && !letters.some(l => !optionTexts[l]);
        const enValid = stemTextEn && explTextEn && !letters.some(l => !optionTextsEn[l]);

        if (!czValid || !enValid) {
          errorMsg.textContent = tr().validationMsg;
          outputWrap.style.display = "none";
          return;
        }

        const newId = getMaxQuestionId() + 1;
        const optionsObjCode = letters
          .map(l => `        ${l}: ${JSON.stringify(optionTexts[l])}`)
          .join(",\n");
        const optionsObjCodeEn = letters
          .map(l => `        ${l}: ${JSON.stringify(optionTextsEn[l])}`)
          .join(",\n");

        let imageKey = null;
        let imageCode = "";
        if (imageDataUrl) {
          imageKey = "q" + newId + "_custom";
          imageCode = `  ${imageKey}: ${JSON.stringify(imageDataUrl)},\n`;
        }

        const imageFieldCode = imageKey
          ? `,\n  image: { key: ${JSON.stringify(imageKey)}, source: ${JSON.stringify(sourceInput.value.trim())}, type: ${JSON.stringify(imageMediaType)} }`
          : "";

        let explImageKey = null;
        let explImageCode = "";
        if (explImageDataUrl) {
          explImageKey = "e" + newId + "_custom";
          explImageCode = `  ${explImageKey}: ${JSON.stringify(explImageDataUrl)},\n`;
        }

        const explImageFieldCode = explImageKey
          ? `,\n  explanationImage: { key: ${JSON.stringify(explImageKey)}, source: ${JSON.stringify(explSourceInput.value.trim())}, type: ${JSON.stringify(explImageMediaType)} }`
          : "";

        const questionCode =
`{
  id: ${newId},
  cz: {
    stem: ${JSON.stringify(stemText)},
    options: {
${optionsObjCode}
    },
    correct: ${JSON.stringify(correctLetter)},
    explanation: ${JSON.stringify(explText)}
  },
  en: {
    stem: ${JSON.stringify(stemTextEn)},
    options: {
${optionsObjCodeEn}
    },
    correct: ${JSON.stringify(correctLetter)},
    explanation: ${JSON.stringify(explTextEn)}
  }${imageFieldCode}${explImageFieldCode}
},`;

        const combinedImageCode = imageCode + explImageCode;

        let finalOutput = "";
        if (combinedImageCode) {
          finalOutput += "// 1) Vlož do objektu IMAGES (na začátku skriptu):\n" + combinedImageCode + "\n";
          finalOutput += `// 2) Vlož do QUESTION_DATA.${unitSelect.value}.chapters.${chapterSelect.value}.questions:\n` + questionCode;
        } else {
          finalOutput += `// Vlož do QUESTION_DATA.${unitSelect.value}.chapters.${chapterSelect.value}.questions:\n` + questionCode;
        }

        outputArea.value = finalOutput;
        outputWrap.style.display = "flex";
      }
    });
    wrap.appendChild(generateBtn);

    return wrap;
  }

      list.appendChild(row);

      // ale samostatná funkce appky — vkládá se natvrdo hned za "Podpořte
      // nás" (před "Přidat otázku"), ať je pořadí v menu stabilní bez
      // ohledu na data.
      if (chKey === "podporte_nas") {
        const searchRow = el("div", {
          cls: "chapter-row",
          onClick: openQuestionSearch
        });
        const searchNameWrap = el("span", { cls: "ch-name-icon" });
        searchNameWrap.innerHTML = settingsChapterIcon("vyhledat_otazku");
        searchNameWrap.appendChild(document.createTextNode(tr().searchQuestionMenuTitle));
        searchRow.appendChild(searchNameWrap);
        list.appendChild(searchRow);
      }
    });
    frag.appendChild(list);

    return frag;
  }
