  function renderQuestionSearch() {
    const frag = el("div");

    frag.appendChild(el("a", {
      cls: "back-link", attrs: { "data-hw-back": "1" },
      text: "← " + tr().back,
      onClick: () => openSettingsList("nastaveni")
    }));

    const head = el("div", { cls: "page-head" });
    head.appendChild(el("h1", { text: tr().searchQuestionMenuTitle }));
    frag.appendChild(head);

    const panel = el("div", { cls: "qsearch-panel" });

    // -- textové pole + nápověda k syntaxi --
    const inputField = el("div", { cls: "aq-field" });
    inputField.appendChild(el("label", { cls: "aq-label", text: tr().searchInputLabel }));
    const input = el("input", {
      cls: "aq-input",
      attrs: { type: "text", placeholder: tr().searchInputPlaceholder }
    });
    input.value = search.query;
    input.addEventListener("input", () => { search.query = input.value; });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") runQuestionSearch(); });
    inputField.appendChild(input);
    inputField.appendChild(el("p", { cls: "qsearch-help", html: tr().searchHelpHtml }));
    panel.appendChild(inputField);

    // -- checkboxy jednotek --
    const unitKeys = Object.keys(QUESTION_DATA).filter(k => k !== "nastaveni");
    const unitsField = el("div", { cls: "aq-field" });
    unitsField.appendChild(el("label", { cls: "aq-label", text: tr().searchUnitsLabel }));
    const unitsRow = el("div", { cls: "qsearch-checkbox-row" });
    unitKeys.forEach(uk => {
      const lbl = el("label", { cls: "qsearch-checkbox" });
      const cb = el("input", { attrs: { type: "checkbox" } });
      cb.checked = !!search.units[uk];
      cb.addEventListener("change", () => {
        search.units[uk] = cb.checked;
        // pokud zrušená jednotka odpovídá zvolené podkapitole, zrušit i filtr podkapitoly
        if (!cb.checked && search.chapterFilter.indexOf(uk + "::") === 0) search.chapterFilter = "";
        render();
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(" " + QUESTION_DATA[uk].title[state.lang]));
      unitsRow.appendChild(lbl);
    });
    // "Živé testy" — 4. políčko vedle běžných jednotek, ale otázky bere ze
    // samostatného LIVE_QUESTION_BANKS (viz runQuestionSearch). Nabízí se
    // jen po přihlášení admina.
    if (live.isAdminUnlocked) {
      const liveLbl = el("label", { cls: "qsearch-checkbox" });
      const liveCb = el("input", { attrs: { type: "checkbox" } });
      liveCb.checked = !!search.units.zive_testy;
      liveCb.addEventListener("change", () => { search.units.zive_testy = liveCb.checked; render(); });
      liveLbl.appendChild(liveCb);
      liveLbl.appendChild(document.createTextNode(" " + tr().searchUnitLiveTests));
      unitsRow.appendChild(liveLbl);
    }
    unitsField.appendChild(unitsRow);
    panel.appendChild(unitsField);

    // -- výběr podkapitoly (jen z aktuálně zaškrtnutých jednotek) --
    const chapterField = el("div", { cls: "aq-field" });
    chapterField.appendChild(el("label", { cls: "aq-label", text: tr().searchChapterLabel }));
    const chapterSelect = el("select", { cls: "aq-select" });
    const allOpt = el("option", { text: tr().searchAllChapters });
    allOpt.value = "";
    chapterSelect.appendChild(allOpt);
    unitKeys.filter(uk => search.units[uk]).forEach(uk => {
      const unit = QUESTION_DATA[uk];
      const group = document.createElement("optgroup");
      group.label = unit.title[state.lang];
      Object.keys(unit.chapters).forEach(chKey => {
        const opt = el("option", { text: unit.chapters[chKey].title[state.lang] });
        opt.value = `${uk}::${chKey}`;
        group.appendChild(opt);
      });
      chapterSelect.appendChild(group);
    });
    chapterSelect.value = search.chapterFilter || "";
    chapterSelect.addEventListener("change", () => { search.chapterFilter = chapterSelect.value; });
    chapterField.appendChild(chapterSelect);
    panel.appendChild(chapterField);

    // -- checkbox "obsahuje obrázek" --
    const imgField = el("div", { cls: "aq-field" });
    const imgLbl = el("label", { cls: "qsearch-checkbox qsearch-checkbox-standalone" });
    const imgCb = el("input", { attrs: { type: "checkbox" } });
    imgCb.checked = !!search.hasImageOnly;
    imgCb.addEventListener("change", () => { search.hasImageOnly = imgCb.checked; });
    imgLbl.appendChild(imgCb);
    imgLbl.appendChild(document.createTextNode(" " + tr().searchHasImageLabel));
    imgField.appendChild(imgLbl);
    panel.appendChild(imgField);

    // -- otázky živých testů (ID >= 10 000): zaškrtávátko je teď 4. položka
    // v "Jednotky" výše (viditelná jen po přihlášení admina); tady jen
    // umožníme admina odhlásit, nebo pokud ještě přihlášený není, otevřeme
    // přímo v tomto panelu stejné admin přihlášení jako u živého testu /
    // přidání otázky (sdílený stav live.showAdminUnlock, live.isAdminUnlocked).
    const liveField = el("div", { cls: "aq-field" });
    if (live.isAdminUnlocked) {
      liveField.appendChild(el("a", { cls: "live-admin-toggle", text: tr().liveAdminLock, onClick: liveLockAdmin }));
    } else if (!live.showAdminUnlock) {
      liveField.appendChild(el("p", { cls: "qsearch-note", text: tr().searchIdLimitNote }));
      liveField.appendChild(el("button", {
        cls: "pill-btn",
        text: tr().searchShowLiveBtn,
        attrs: { type: "button" },
        onClick: liveOpenAdminUnlock
      }));
    } else {
      const unlockBox = el("div", { cls: "live-field live-admin-unlock-box" });
      unlockBox.appendChild(el("label", { text: tr().liveAdminUnlockLabel }));
      const pwInput = el("input", {
        attrs: { type: "password", placeholder: tr().liveAdminUnlockPh, autocomplete: "off" }
      });
      pwInput.value = live.adminUnlockInput || "";
      pwInput.disabled = !!live.adminUnlockChecking;
      pwInput.addEventListener("input", () => { live.adminUnlockInput = pwInput.value; });
      pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !live.adminUnlockChecking) liveSubmitAdminUnlock(); });
      unlockBox.appendChild(pwInput);

      if (live.adminUnlockError) {
        unlockBox.appendChild(el("div", { cls: "live-error", text: live.adminUnlockError }));
      }

      const unlockActions = el("div", { cls: "live-actions" });
      const unlockBtn = el("button", {
        cls: "pill-btn primary",
        text: live.adminUnlockChecking ? tr().liveAdminUnlockChecking : tr().liveAdminUnlockBtn,
        onClick: live.adminUnlockChecking ? () => {} : liveSubmitAdminUnlock
      });
      if (live.adminUnlockChecking) unlockBtn.disabled = true;
      unlockActions.appendChild(unlockBtn);
      unlockActions.appendChild(el("button", { cls: "pill-btn", text: tr().liveAdminUnlockCancel, onClick: liveCloseAdminUnlock }));
      unlockBox.appendChild(unlockActions);

      liveField.appendChild(unlockBox);
    }
    panel.appendChild(liveField);

    // -- tlačítko hledat --
    const actions = el("div", { cls: "qsearch-actions" });
    actions.appendChild(el("button", { cls: "pill-btn primary", text: tr().searchButton, onClick: runQuestionSearch }));
    panel.appendChild(actions);

    frag.appendChild(panel);

    // -- výsledky --
    if (search.hasSearched) {
      const resultsWrap = el("div", { cls: "qsearch-results" });
      resultsWrap.appendChild(el("div", { cls: "qsearch-results-count", text: tr().searchResultsCount(search.results.length) }));
      if (search.results.length === 0) {
        const empty = el("div", { cls: "empty-state" });
        empty.appendChild(el("p", { text: tr().searchNoResults }));
        resultsWrap.appendChild(empty);
      } else {
        const list = el("div", { cls: "chapter-list qsearch-list" });
        search.results.forEach(q => list.appendChild(renderSearchResultRow(q)));
        resultsWrap.appendChild(list);
      }
      frag.appendChild(resultsWrap);
    }

    return frag;
  }

  function renderSearchResultRow(q) {
    const qData = q[state.lang];
    const row = el("div", { cls: "qsearch-row", onClick: () => openSearchResult(q) });

    const top = el("div", { cls: "qsearch-row-top" });
    top.appendChild(el("span", { cls: "qsearch-row-id", text: `#${q.id}` }));
    const chapterLabel = q._chapterKey ? chapterTitle(q._unitKey, q._chapterKey) : tr().searchLiveBankLabel;
    top.appendChild(el("span", {
      cls: "qsearch-row-chapter",
      text: `${unitTitle(q._unitKey)} · ${chapterLabel}`
    }));
    if (q.image && q.image.key) {
      top.appendChild(el("span", { cls: "qsearch-row-imgicon", text: "🖼" }));
    }
    row.appendChild(top);

    const stemText = qData && qData.stem ? String(qData.stem) : "";
    const snippet = stemText.length > 160 ? stemText.slice(0, 160) + "…" : stemText;
    row.appendChild(el("div", { cls: "qsearch-row-snippet", text: snippet }));

    return row;
  }

  function renderNewsList() {
    const frag = el("div");

    frag.appendChild(el("a", { cls: "back-link", attrs: { "data-hw-back": "1" }, text: "← " + tr().newsBackToMenu, onClick: () => openSettingsList("nastaveni") }));

    const head = el("div", { cls: "page-head" });
    head.appendChild(el("h1", { text: tr().newsTitle }));
    frag.appendChild(head);

    if (NEWS_DATA.length === 0) {
      const empty = el("div", { cls: "empty-state" });
      empty.appendChild(el("p", { text: tr().newsEmpty }));
      frag.appendChild(empty);
      return frag;
    }

    const feed = el("div", { cls: "news-feed" });

    NEWS_DATA.forEach(item => {
      const post = el("article", { cls: "news-post" });

      const postHead = el("div", { cls: "news-post-head" });
      postHead.appendChild(el("h2", { cls: "news-post-title", text: item.title[state.lang] }));
      postHead.appendChild(el("span", { cls: "news-post-date", text: formatNewsDate(item.date) }));
      post.appendChild(postHead);

      const body = el("div", { cls: "news-post-body" });
      String(item.text[state.lang]).split("\n\n").forEach(paragraph => {
        if (paragraph.trim() === "") return;
        body.appendChild(el("p", { text: paragraph }));
      });
      post.appendChild(body);

      feed.appendChild(post);
    });

    frag.appendChild(feed);

    return frag;
  }

  function renderChapterList() {
    const frag = el("div");
    const unit = QUESTION_DATA[state.unitKey];
    const allQs = getAllQuestionsForUnit(state.unitKey);
    const totalQs = allQs.length;

    frag.appendChild(el("a", { cls: "back-link", attrs: { "data-hw-back": "1" }, text: "← " + tr().back, onClick: () => openUnit(state.unitKey) }));

    const head = el("div", { cls: "page-head" });
    head.appendChild(el("h1", { text: unit.title[state.lang] }));
    frag.appendChild(head);

    const list = el("div", { cls: "chapter-list" });

    const allRow = el("div", {
      cls: "chapter-row chapter-row-all" + (totalQs === 0 ? " empty" : ""),
      onClick: totalQs > 0 ? () => startBrowse(state.unitKey, null) : null
    });
    allRow.appendChild(el("span", { cls: "ch-name", text: tr().browseAll }));
    const allRight = el("span", { cls: "ch-count-wrap" });
    allRight.appendChild(el("span", { cls: "ch-count", text: tr().questionsCount(totalQs) }));
    if (state.saveProgress && totalQs > 0) {
      const done = countDone(allQs);
      allRight.appendChild(el("span", { cls: "ch-progress", text: tr().progressLabel(done, totalQs - done) }));
    }
    allRow.appendChild(allRight);
    list.appendChild(allRow);

    Object.keys(unit.chapters).forEach(chKey => {
      const ch = unit.chapters[chKey];
      const count = ch.questions.length;
      const row = el("div", {
        cls: "chapter-row" + (count === 0 ? " empty" : ""),
        onClick: count > 0 ? () => openChapterMenu(state.unitKey, chKey) : null
      });
      row.appendChild(el("span", { cls: "ch-name", text: ch.title[state.lang] }));
      const chImgSrc = chapterImageSrc(chKey);
      if (chImgSrc) {
        row.appendChild(el("img", { cls: "ch-thumb", attrs: { src: chImgSrc, alt: "" } }));
      }
      const right = el("span", { cls: "ch-count-wrap" });
      right.appendChild(el("span", { cls: "ch-count", text: tr().questionsCount(count) }));
      if (state.saveProgress && count > 0) {
        const done = countDone(ch.questions);
        right.appendChild(el("span", { cls: "ch-progress", text: tr().progressLabel(done, count - done) }));
      }
      row.appendChild(right);
      list.appendChild(row);
    });

    // Favorites row
    const favQs = getFavoriteQuestionsForUnit(state.unitKey);
    const favCount = favQs.length;
    const favRow = el("div", {
      cls: "chapter-row-fav" + (favCount === 0 ? " empty" : ""),
      onClick: favCount > 0 ? () => startBrowseFavorites(state.unitKey) : null
    });
    const favNameWrap = el("span", { cls: "ch-name-fav" });
    favNameWrap.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
    favNameWrap.appendChild(document.createTextNode(tr().favorites));
    favRow.appendChild(favNameWrap);
    const favRight = el("span", { cls: "ch-count-wrap" });
    favRight.appendChild(el("span", { cls: "ch-count", text: tr().questionsCount(favCount) }));
    favRow.appendChild(favRight);
    list.appendChild(favRow);

    frag.appendChild(list);

    return frag;
  }

          }
        });
        const paypalLogo = el("span", { cls: "support-paypal-logo" });
        paypalLogo.appendChild(el("span", { cls: "pp-blue", text: "Pay" }));
        paypalLogo.appendChild(el("span", { cls: "pp-lblue", text: "Pal" }));
        paypalLink.appendChild(paypalLogo);
        paypalLink.appendChild(el("span", { text: "paypal.me/USMLEanatomy" }));
        paypalWrap.appendChild(paypalLink);
        row.appendChild(paypalWrap);

        panel.appendChild(row);
      } else if (chapterKey === "pridat_otazku") {
        panel.appendChild(renderAddQuestionForm());
      }

      frag.appendChild(panel);
      return frag;
    }

    const count = getChapterQuestions(unitKey, chapterKey).length;

    const backTarget = () => openChapterList(unitKey);
    const backText = tr().backToChapters;
    frag.appendChild(el("a", { cls: "back-link", attrs: { "data-hw-back": "1" }, text: "← " + backText, onClick: backTarget }));

    const head = el("div", { cls: "page-head" });
    head.appendChild(el("h1", { text: chapterTitle(unitKey, chapterKey) }));
    frag.appendChild(head);

    if (count === 0) {
      frag.appendChild(renderEmptyState());
      return frag;
    }

    const body = el("div", { cls: "chapter-body-row" });
    const leftCol = el("div", { cls: "chapter-body-left" });

    if (state.saveProgress) {
      const chQs = getChapterQuestions(unitKey, chapterKey);
      const done = countDone(chQs);
      leftCol.appendChild(el("div", { cls: "chapter-progress-line", text: tr().progressLabel(done, count - done) }));
    }

    const actions = el("div", { cls: "chapter-actions" });
    actions.appendChild(el("button", {
      cls: "pill-btn primary",
      text: `${tr().browseAll} (${count})`,
      onClick: () => startBrowse(unitKey, chapterKey)
    }));
    leftCol.appendChild(actions);
    body.appendChild(leftCol);

    const heroImgSrc = chapterImageSrc(chapterKey);
    if (heroImgSrc) {
      const heroWrap = el("div", { cls: "chapter-hero-img" });
      heroWrap.appendChild(el("img", { attrs: { src: heroImgSrc, alt: "" } }));
      body.appendChild(heroWrap);
    }

    frag.appendChild(body);

    return frag;
  }

  function renderEmptyState() {
    const wrap = el("div", { cls: "empty-state" });
    wrap.appendChild(el("h3", { text: tr().emptyTitle }));
    wrap.appendChild(el("p", { text: tr().emptyBody }));
    return wrap;
  }

  // ============ KOMENTÁŘE K OTÁZKÁM — logika ============
  // Datový model a Firebase Security Rules: viz COMMENTS-SETUP.md

  function commentsListDomId(qId) { return `comments-list-${qId}`; }
  function commentsCountDomId(qId) { return `comments-count-${qId}`; }

  function commentsCountFor(qId) {
    const map = comments.byQuestion[qId];
    return map ? Object.keys(map).length : 0;
  }

  function commentsSubscribe(qId) {
    const fb = getFb();
    if (!fb || comments.listeners[qId]) return;
    const r = fb.ref(fb.db, `comments/${qId}`);
    const cb = fb.onValue(r, (snap) => {
      comments.byQuestion[qId] = snap.val() || {};
      commentsRefreshPanel(qId);
    }, (err) => {
      console.error("comments listener error:", err);
      comments.error[qId] = tr().commentsErrLoad;
      commentsRefreshPanel(qId);
    });
    comments.listeners[qId] = { ref: r, cb };
  }

  function commentsUnsubscribe(qId) {
    const fb = getFb();
    const l = comments.listeners[qId];
    if (fb && l) fb.off(l.ref, "value", l.cb);
    delete comments.listeners[qId];
  }

  // Přerenderuje jen seznam komentářů a badge s počtem (ne celou appku), aby živé
  // aktualizace od jiných uživatelů nezahodily rozepsaný text v textarea ani scroll.
  function commentsRefreshPanel(qId) {
    const listEl = document.getElementById(commentsListDomId(qId));
    if (listEl) listEl.replaceWith(buildCommentsList(qId));
    const countEl = document.getElementById(commentsCountDomId(qId));
    if (countEl && comments.openQuestionId !== qId) countEl.textContent = tr().commentsToggleShow(commentsCountFor(qId));
  }

  // Zavře panel komentářů a odhlásí Firebase listener — voláno při odchodu z otázky
  // (další/předchozí otázka, návrat zpět, konec testu apod.), aby nezůstávaly viset
  // aktivní real-time listenery na otázky, které si uživatel už nezobrazuje.
  function commentsCloseAll() {
    if (comments.openQuestionId !== null) {
      commentsUnsubscribe(comments.openQuestionId);
      comments.openQuestionId = null;
    }
  }

  function commentsToggle(qId) {
    if (comments.openQuestionId === qId) {
      commentsUnsubscribe(qId);
      comments.openQuestionId = null;
    } else {
      if (comments.openQuestionId !== null) commentsUnsubscribe(comments.openQuestionId);
      comments.openQuestionId = qId;
      comments.error[qId] = "";
      commentsSubscribe(qId);
    }
    render();
  }

  async function commentsSubmit(qId, name, text, parentId) {
    const fb = getFb();
    if (!fb) return;
    const cleanName = (name || "").trim();
    const body = (text || "").trim();
    comments.error[qId] = "";
    if (!cleanName) { comments.error[qId] = tr().commentsErrNameRequired; commentsRefreshPanel(qId); return; }
    if (!body) { comments.error[qId] = tr().commentsErrTextRequired; commentsRefreshPanel(qId); return; }
    comments.sending = true;
    commentsRefreshPanel(qId);
    try {
      const uid = await waitForAuthOrTimeout(12000);
      const listRef = fb.ref(fb.db, `comments/${qId}`);
      const newRef = fb.push(listRef);
      await fb.set(newRef, {
        text: body,
        authorName: cleanName,
        authorUid: uid,
        createdAt: fb.serverTimestamp(),
        parentId: parentId || null
      });
      comments.replyTo[qId] = null;
    } catch (err) {
      console.error("commentsSubmit failed:", err);
      comments.error[qId] = tr().commentsErrGeneric;
    } finally {
      comments.sending = false;
      commentsRefreshPanel(qId);
    }
  }

  async function commentsVote(qId, commentId, dir) {
    const fb = getFb();
    if (!fb) return;
    try {
      const uid = await waitForAuthOrTimeout(12000);
      const current = comments.byQuestion[qId] &&
        comments.byQuestion[qId][commentId] &&
        comments.byQuestion[qId][commentId].voters &&
        comments.byQuestion[qId][commentId].voters[uid];
      const voteRef = fb.ref(fb.db, `comments/${qId}/${commentId}/voters/${uid}`);
      // Druhé kliknutí na stejný hlas ho zruší, jinak se hlas nastaví/přehodí.
      await fb.set(voteRef, current === dir ? null : dir);
    } catch (err) {
      console.error("commentsVote failed:", err);
    }
  }

  async function commentsDelete(qId, commentId) {
    if (!confirm(tr().commentsDeleteConfirm)) return;
    const fb = getFb();
    if (!fb) return;
    try {
      await fb.set(fb.ref(fb.db, `comments/${qId}/${commentId}`), null);
    } catch (err) {
      console.error("commentsDelete failed:", err);
    }
  }

  // Otevře/zavře formulář nahlášení pod daným komentářem (jeden najednou na otázku,
  // stejně jako u odpovídání — viz comments.replyTo).
  function commentsReportToggle(qId, commentId) {
    comments.reportError[qId] = "";
    comments.reportOpen[qId] = comments.reportOpen[qId] === commentId ? null : commentId;
    commentsRefreshPanel(qId);
  }

  // Zapíše nahlášení do Firebase (audit trail pro adminy v konzoli / budoucí admin
  // přehled) a zavolá server endpoint, který pošle e-mailové upozornění. Firebase
  // zápis je zdroj pravdy — pokud se e-mail nepodaří odeslat (výpadek endpointu,
  // limitovaný e-mail provider apod.), nahlášení samotné se přesto neztratí a
  // uživateli to nezobrazujeme jako chybu.
  async function commentsReportSubmit(qId, commentId, reason) {
    const cleanReason = (reason || "").trim();
    comments.reportError[qId] = "";
    if (!cleanReason) {
      comments.reportError[qId] = tr().commentsReportErrRequired;
      commentsRefreshPanel(qId);
      return;
    }
    const fb = getFb();
    if (!fb) {
      comments.reportError[qId] = tr().commentsReportErrGeneric;
      commentsRefreshPanel(qId);
      return;
    }
    comments.reportSending = true;
    commentsRefreshPanel(qId);

    const c = comments.byQuestion[qId] && comments.byQuestion[qId][commentId];
    const payload = {
      questionId: qId,
      commentId,
      commentText: (c && c.text) || "",
      commentAuthorName: (c && c.authorName) || "",
      reason: cleanReason
    };

    try {
      const uid = await waitForAuthOrTimeout(12000);
      const reportsRef = fb.ref(fb.db, `reports/${qId}/${commentId}`);
      const newRef = fb.push(reportsRef);
      await fb.set(newRef, {
        reason: cleanReason,
        commentText: payload.commentText,
        commentAuthorName: payload.commentAuthorName,
        reporterUid: uid,
        createdAt: fb.serverTimestamp()
      });

      // E-mailové upozornění přes server endpoint — viz functions/api/report-comment.js.
      // Nepovinné pro to, aby se nahlášení "počítalo": pokud selže síť/endpoint,
      // report už je bezpečně v databázi, jen se admin nedozví hned e-mailem.
      try {
        await fetch("/api/report-comment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (mailErr) {
        console.error("report-comment email notify failed:", mailErr);
      }

      if (!comments.reportDone[qId]) comments.reportDone[qId] = {};
      comments.reportDone[qId][commentId] = true;
      comments.reportOpen[qId] = null;
    } catch (err) {
      console.error("commentsReportSubmit failed:", err);
      comments.reportError[qId] = tr().commentsReportErrGeneric;
    } finally {
      comments.reportSending = false;
      commentsRefreshPanel(qId);
    }
  }

  function buildCommentReportForm(qId, commentId) {
    const form = el("div", { cls: "comment-form comment-report-form" });

    const textArea = el("textarea", {
      cls: "comment-text-input",
      attrs: { rows: "2", placeholder: tr().commentsReportPlaceholder, maxlength: "500" }
    });
    form.appendChild(textArea);

    const err = comments.reportError[qId];
    if (err) form.appendChild(el("div", { cls: "comment-error", text: err }));

    const btnRow = el("div", { cls: "comment-form-actions" });
    btnRow.appendChild(el("button", {
      cls: "pill-btn primary comment-submit-btn",
      text: comments.reportSending ? tr().commentsReportSending : tr().commentsReportSubmit,
      onClick: () => { if (!comments.reportSending) commentsReportSubmit(qId, commentId, textArea.value); }
    }));
    btnRow.appendChild(el("button", {
      cls: "pill-btn comment-cancel-btn",
      text: tr().commentsReportCancel,
      onClick: () => { comments.reportOpen[qId] = null; commentsRefreshPanel(qId); }
    }));
    form.appendChild(btnRow);
    return form;
  }

  function commentsFormatTime(ts) {
    if (!ts) return "";
    try {
      const d = new Date(ts);
      return d.toLocaleDateString(state.lang === "cz" ? "cs-CZ" : "en-US", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }

  function buildCommentItem(qId, commentId, c, depth) {
    const voters = c.voters || {};
    let up = 0, down = 0;
    Object.values(voters).forEach((v) => { if (v === "up") up++; else if (v === "down") down++; });
    const myVote = live.uid ? voters[live.uid] : null;
    const canDelete = live.isAdminUnlocked || (live.uid && c.authorUid === live.uid);
    const indent = Math.min(depth, 6) * 22;

    const wrap = el("div", { cls: "comment-item" + (depth > 0 ? " comment-reply" : "") });
    if (depth > 0) wrap.style.marginLeft = indent + "px";
    const head = el("div", { cls: "comment-head" });
    head.appendChild(el("span", { cls: "comment-author", text: c.authorName || "?" }));
    head.appendChild(el("span", { cls: "comment-time", text: commentsFormatTime(c.createdAt) }));
    wrap.appendChild(head);
    wrap.appendChild(el("div", { cls: "comment-text", text: c.text || "" }));

    const actions = el("div", { cls: "comment-actions" });
    const upBtn = el("button", {
      cls: "comment-vote-btn" + (myVote === "up" ? " active" : ""),
      text: `👍 ${up}`,
      onClick: () => commentsVote(qId, commentId, "up")
    });
    const downBtn = el("button", {
      cls: "comment-vote-btn" + (myVote === "down" ? " active" : ""),
      text: `👎 ${down}`,
      onClick: () => commentsVote(qId, commentId, "down")
    });
    actions.appendChild(upBtn);
    actions.appendChild(downBtn);

    actions.appendChild(el("button", {
      cls: "comment-reply-btn",
      text: tr().commentsReply,
      onClick: () => { comments.replyTo[qId] = commentId; commentsRefreshPanel(qId); }
    }));

    const alreadyReported = !!(comments.reportDone[qId] && comments.reportDone[qId][commentId]);
    actions.appendChild(el("button", {
      cls: "comment-report-btn" + (alreadyReported ? " is-done" : ""),
      text: alreadyReported ? tr().commentsReportDone : tr().commentsReportBtn,
      attrs: alreadyReported ? { disabled: "disabled" } : {},
      onClick: () => { if (!alreadyReported) commentsReportToggle(qId, commentId); }
    }));

    if (canDelete) {
      actions.appendChild(el("button", {
        cls: "comment-delete-btn",
        text: tr().commentsDelete,
        onClick: () => commentsDelete(qId, commentId)
      }));
    }

    wrap.appendChild(actions);

    if (comments.replyTo[qId] === commentId) {
      wrap.appendChild(buildCommentForm(qId, commentId));
    }

    if (comments.reportOpen[qId] === commentId) {
      wrap.appendChild(buildCommentReportForm(qId, commentId));
    } else if (alreadyReported) {
      wrap.appendChild(el("div", { cls: "comment-report-thanks", text: tr().commentsReportThanks }));
    }

    return wrap;
  }

  function buildCommentForm(qId, parentId) {
    const isReply = !!parentId;
    const form = el("div", { cls: "comment-form" + (isReply ? " comment-reply-form" : "") });

    if (isReply) {
      const parent = comments.byQuestion[qId] && comments.byQuestion[qId][parentId];
      if (parent) form.appendChild(el("div", { cls: "comment-replying-to", text: tr().commentsReplyingTo(parent.authorName || "?") }));
    }

    // Pole na jméno je vždy prázdné — nerecykluje se ze žádné dřívější relace ani odeslání.
    const nameInput = el("input", {
      cls: "comment-name-input",
      attrs: { type: "text", placeholder: tr().commentsNamePh, maxlength: "40", autocomplete: "off" }
    });
    form.appendChild(nameInput);

    const textArea = el("textarea", {
      cls: "comment-text-input",
      attrs: { rows: "2", placeholder: isReply ? tr().commentsReplyPlaceholder : tr().commentsPlaceholder, maxlength: "1000" }
    });
    form.appendChild(textArea);

    const err = comments.error[qId];
    if (err) form.appendChild(el("div", { cls: "comment-error", text: err }));

    const btnRow = el("div", { cls: "comment-form-actions" });
    btnRow.appendChild(el("button", {
      cls: "pill-btn primary comment-submit-btn",
      text: comments.sending ? tr().commentsSending : tr().commentsSubmit,
      onClick: () => { if (!comments.sending) commentsSubmit(qId, nameInput.value, textArea.value, parentId); }
    }));
    if (isReply) {
      btnRow.appendChild(el("button", {
        cls: "pill-btn comment-cancel-btn",
        text: tr().commentsCancelReply,
        onClick: () => { comments.replyTo[qId] = null; commentsRefreshPanel(qId); }
      }));
    }
    form.appendChild(btnRow);
    return form;
  }

  // Rekurzivně vykreslí vlákno: komentář může být odpovědí na odpověď na odpověď atd.,
  // bez omezení hloubky (vizuální odsazení se ale nad určitou úrovní dál nezvětšuje).
  function buildCommentTree(qId, map, parentId, depth) {
    const frag = document.createDocumentFragment();
    const ids = Object.keys(map)
      .filter((id) => (map[id].parentId || null) === parentId)
      .sort((a, b) => (map[a].createdAt || 0) - (map[b].createdAt || 0));
    ids.forEach((id) => {
      frag.appendChild(buildCommentItem(qId, id, map[id], depth));
      frag.appendChild(buildCommentTree(qId, map, id, depth + 1));
    });
    return frag;
  }

  function buildCommentsList(qId) {
    const list = el("div", { cls: "comments-list", attrs: { id: commentsListDomId(qId) } });
    const map = comments.byQuestion[qId] || {};
    if (Object.keys(map).length === 0) {
      list.appendChild(el("div", { cls: "comments-empty", text: tr().commentsEmpty }));
      return list;
    }
    list.appendChild(buildCommentTree(qId, map, null, 0));
    return list;
  }

  function buildCommentsSection(qId) {
    const section = el("div", { cls: "comments-section" });
    const isOpen = comments.openQuestionId === qId;

    const toggleBtn = el("button", {
      cls: "comments-toggle-btn",
      onClick: () => commentsToggle(qId)
    });
    toggleBtn.appendChild(el("span", {
      attrs: { id: commentsCountDomId(qId) },
      text: isOpen ? tr().commentsToggleHide : tr().commentsToggleShow(commentsCountFor(qId))
    }));
    section.appendChild(toggleBtn);

    if (isOpen) {
      const panel = el("div", { cls: "comments-panel" });
      panel.appendChild(buildCommentsList(qId));
      if (comments.replyTo[qId] == null) panel.appendChild(buildCommentForm(qId, null));
      section.appendChild(panel);
      if (!comments.listeners[qId]) commentsSubscribe(qId);
    }

    return section;
  }

  // ============ NAHLÁŠENÍ CHYBY V OTÁZCE — logika ============
  // Uživatel nahlásí chybu v aktuální otázce a volitelně navrhne opravené znění
  // (CZ i EN, včetně případné změny správné odpovědi). Nahlášení se zapíše do
  // Firebase (audit trail, stejný princip jako u nahlašování komentářů výše) a
  // zavolá se server endpoint, který pošle e-mailové upozornění přes Resend —
  // viz functions/api/report-question.js.
  // Realtime Database Security Rules: viz komentář u cesty "reports/" výše
  // (sekce KOMENTÁŘE) — cesta "questionReports/{qId}/{pushId}" potřebuje
  // analogické pravidlo, viz REPORT-QUESTION-SETUP.md.

  function qreportOptionLetters(q) {
    return Object.keys(q.cz.options);
  }

  function qreportOpen(q) {
    qreport.open = true;
    qreport.question = q;
    qreport.description = "";
    qreport.error = "";
    qreport.sending = false;
    qreport.sent = false;
    const letters = qreportOptionLetters(q);
    const cloneLang = (langData) => {
      const options = {};
      letters.forEach(l => { options[l] = langData.options[l] || ""; });
      return { stem: langData.stem, options, correct: langData.correct, explanation: langData.explanation };
    };
    qreport.proposed = { cz: cloneLang(q.cz), en: cloneLang(q.en) };
    renderQreportModal();
  }

  function qreportClose() {
    qreport.open = false;
    qreport.question = null;
    qreport.proposed = null;
    const existing = document.getElementById("qreport-overlay");
    if (existing) existing.remove();
  }

  async function qreportSubmit() {
    const q = qreport.question;
    if (!q) return;
    const cleanDesc = (qreport.description || "").trim();
    qreport.error = "";
    if (!cleanDesc) {
      qreport.error = tr().qreportErrRequired;
      renderQreportModal();
      return;
    }
    const fb = getFb();
    if (!fb) {
      qreport.error = tr().qreportErrGeneric;
      renderQreportModal();
      return;
    }
    qreport.sending = true;
    renderQreportModal();

    const payload = {
      questionId: q.id,
      description: cleanDesc,
      original: { cz: q.cz, en: q.en },
      proposed: qreport.proposed
    };

    try {
      const uid = await waitForAuthOrTimeout(12000);
      const reportsRef = fb.ref(fb.db, `questionReports/${q.id}`);
      const newRef = fb.push(reportsRef);
      await fb.set(newRef, {
        description: cleanDesc,
        original: payload.original,
        proposed: payload.proposed,
        reporterUid: uid,
        createdAt: fb.serverTimestamp()
      });

      // E-mailové upozornění přes server endpoint — viz functions/api/report-question.js.
      // Nepovinné pro to, aby se nahlášení "počítalo": Firebase zápis výše je zdroj
      // pravdy, e-mail je jen notifikace navíc (stejný princip jako u komentářů).
      try {
        await fetch("/api/report-question", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (mailErr) {
        console.error("report-question email notify failed:", mailErr);
      }

      qreport.sent = true;
    } catch (err) {
      console.error("qreportSubmit failed:", err);
      qreport.error = tr().qreportErrGeneric;
    } finally {
      qreport.sending = false;
      renderQreportModal();
    }
  }

  function renderQreportModal() {
    const existing = document.getElementById("qreport-overlay");
    if (existing) existing.remove();
    if (!qreport.open || !qreport.question) return;

    const q = qreport.question;
    const letters = qreportOptionLetters(q);

    const overlay = el("div", { cls: "qreport-overlay", attrs: { id: "qreport-overlay" } });
    overlay.addEventListener("click", (e) => { if (e.target === overlay) qreportClose(); });

    const modal = el("div", { cls: "qreport-modal" });
    modal.addEventListener("click", (e) => e.stopPropagation());

    modal.appendChild(el("button", {
      cls: "qreport-close-btn",
      text: "×",
      attrs: { "aria-label": tr().qreportCancel, type: "button" },
      onClick: () => qreportClose()
    }));

    modal.appendChild(el("h2", { cls: "qreport-title", text: tr().qreportModalTitle }));

    if (qreport.sent) {
      modal.appendChild(el("div", { cls: "qreport-thanks", text: tr().qreportThanks }));
      const actions = el("div", { cls: "qreport-actions" });
      actions.appendChild(el("button", {
        cls: "pill-btn primary",
        text: tr().qreportCancel,
        onClick: () => qreportClose()
      }));
      modal.appendChild(actions);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      return;
    }

    const form = el("div", { cls: "qreport-form" });

    // Povinné pole — popis chyby
    const descField = el("div", { cls: "aq-field" });
    const descLabel = el("label", { cls: "aq-label" });
    descLabel.appendChild(document.createTextNode(tr().qreportDescLabel + " "));
    descLabel.appendChild(el("span", { cls: "qreport-required", text: "*" }));
    descField.appendChild(descLabel);
    const descInput = el("textarea", {
      cls: "aq-textarea",
      attrs: { rows: "3", placeholder: tr().qreportDescPlaceholder, maxlength: "2000" }
    });
    descInput.value = qreport.description;
    descInput.addEventListener("input", () => { qreport.description = descInput.value; });
    descField.appendChild(descInput);
    form.appendChild(descField);

    form.appendChild(el("h3", { cls: "qreport-proposed-heading", text: tr().qreportProposedTitle }));

    function buildLangSection(langKey, sectionTitle) {
      form.appendChild(el("h4", { cls: "aq-section-title", text: sectionTitle }));

      const stemField = el("div", { cls: "aq-field" });
      stemField.appendChild(el("label", { cls: "aq-label", text: tr().fieldStem }));
      const stemInput = el("textarea", { cls: "aq-textarea", attrs: { rows: "3" } });
      stemInput.value = qreport.proposed[langKey].stem;
      stemInput.addEventListener("input", () => { qreport.proposed[langKey].stem = stemInput.value; });
      stemField.appendChild(stemInput);
      form.appendChild(stemField);

      const optionsField = el("div", { cls: "aq-field" });
      optionsField.appendChild(el("label", { cls: "aq-label", text: tr().fieldOptions }));
      letters.forEach(letter => {
        const row = el("div", { cls: "aq-option-row" });
        const radio = el("input", { attrs: { type: "radio", name: `qreport-correct-${langKey}` } });
        radio.checked = qreport.proposed[langKey].correct === letter;
        radio.addEventListener("change", () => {
          qreport.proposed.cz.correct = letter;
          qreport.proposed.en.correct = letter;
        });
        const letterLabel = el("span", { cls: "aq-option-letter", text: letter.toUpperCase() });
        const textInput = el("input", { cls: "aq-input aq-option-input", attrs: { type: "text" } });
        textInput.value = qreport.proposed[langKey].options[letter];
        textInput.addEventListener("input", () => { qreport.proposed[langKey].options[letter] = textInput.value; });
        row.appendChild(radio);
        row.appendChild(letterLabel);
        row.appendChild(textInput);
        optionsField.appendChild(row);
      });
      form.appendChild(optionsField);

      const explField = el("div", { cls: "aq-field" });
      explField.appendChild(el("label", { cls: "aq-label", text: tr().fieldExplanation }));
      const explInput = el("textarea", { cls: "aq-textarea", attrs: { rows: "3" } });
      explInput.value = qreport.proposed[langKey].explanation;
      explInput.addEventListener("input", () => { qreport.proposed[langKey].explanation = explInput.value; });
      explField.appendChild(explInput);
      form.appendChild(explField);
    }

    buildLangSection("cz", tr().sectionCzTitle);
    buildLangSection("en", tr().sectionEnTitle);

    if (qreport.error) form.appendChild(el("div", { cls: "qreport-error", text: qreport.error }));

    const actions = el("div", { cls: "qreport-actions" });
    actions.appendChild(el("button", {
      cls: "pill-btn comment-cancel-btn",
      text: tr().qreportCancel,
      onClick: () => qreportClose()
    }));
    actions.appendChild(el("button", {
      cls: "pill-btn primary comment-submit-btn",
      text: qreport.sending ? tr().qreportSending : tr().qreportSubmit,
      onClick: () => { if (!qreport.sending) qreportSubmit(); }
    }));
    form.appendChild(actions);

    modal.appendChild(form);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

  function buildQuestionImageWrap(imageMeta, sourceLabel) {
    if (!imageMeta || !IMAGES[imageMeta.key]) return null;
    const imgWrap = el("div", { cls: "q-image-wrap" });
    const isVideo = imageMeta.type === "video";
    const imgEl = isVideo
      ? el("video", { cls: "q-image", attrs: { src: IMAGES[imageMeta.key], controls: "controls" } })
      : el("img", {
          cls: "q-image",
          attrs: { src: IMAGES[imageMeta.key], alt: "" },
          onClick: () => openLightbox(IMAGES[imageMeta.key], "image")
        });
    imgWrap.appendChild(imgEl);
    if (imageMeta.source) {
      imgWrap.appendChild(el("div", { cls: "q-image-source", text: `${sourceLabel}: ${imageMeta.source}` }));
    }
    return imgWrap;
  }

  function renderQuiz() {
    const frag = el("div");
    const idx = state.currentIndex;
    const total = state.questions.length;
    const q = state.questions[idx];
    const qData = q[state.lang];
    const answer = state.answers[idx];
    const isAnswered = !!answer;

    // Topbar
    const topbar = el("div", { cls: "quiz-topbar" });
    topbar.appendChild(el("a", {
      cls: "back-link", attrs: { "data-hw-back": "1" },
      text: "← " + ((state.mode === "live" || state.mode === "daily") ? tr().backToUnits : (state._isSearchBrowse ? tr().searchBackLabel : tr().backToChapters)),
      onClick: () => {
        stopTimer();
        commentsCloseAll();
        if (state.mode === "live") { goHome(); return; }
        if (state.mode === "daily") { dailyBackToEntryFromQuiz(); return; }
        if (state.mode === "test") openUnit(state.unitKey);
        else if (state._isSearchBrowse) { state._isSearchBrowse = false; openQuestionSearch(); }
        else if (state._isFavoritesBrowse) { state._isFavoritesBrowse = false; openChapterList(state.unitKey); }
        else if (state.chapterKey) openChapterMenu(state.unitKey, state.chapterKey);
        else openChapterList(state.unitKey);
      }
    }));
    topbar.appendChild(el("div", { cls: "quiz-progress", text: `${tr().question} ${idx + 1} ${tr().of} ${total}` }));
    if (state.mode === "test" || state.mode === "live") {
      const timerEl = el("div", { cls: "timer", attrs: { id: "timer-display" }, text: formatTime(state.timerSeconds) });
      if (state.timerSeconds <= 60) timerEl.classList.add("warning");
      topbar.appendChild(timerEl);
    } else if (state.mode === "daily") {
      const timerEl = el("div", { cls: "timer", attrs: { id: "daily-timer-display" }, text: formatTime(Math.floor(daily.elapsedMs / 1000)) });
      topbar.appendChild(timerEl);
    } else if (state.mode === "browse" && q.id !== undefined && q.id !== null) {
      topbar.appendChild(el("button", {
        cls: "qreport-btn",
        text: tr().qreportBtn,
        attrs: { type: "button" },
        onClick: () => qreportOpen(q)
      }));
    } else {
      topbar.appendChild(el("div"));
    }
    frag.appendChild(topbar);

    // Question card
    const card = el("div", { cls: "question-card" });
    const qNumberLabel = (q.id !== undefined && q.id !== null) ? q.id : (idx + 1);
    card.appendChild(el("div", { cls: "q-number", text: `${tr().questionIdLabel} ${qNumberLabel}` }));

    // Favorite button
    if (q.id !== undefined && q.id !== null) {
      const favBtn = el("button", {
        cls: "fav-btn" + (isFavorite(q.id) ? " active" : ""),
        attrs: { title: isFavorite(q.id) ? tr().removeFromFavorites : tr().addToFavorites }
      });
      const heartFilled = `<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
      const heartOutline = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" xmlns="http://www.w3.org/2000/svg"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
      favBtn.innerHTML = isFavorite(q.id) ? heartFilled : heartOutline;
      favBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFavorite(q.id);
        render();
      });
      card.appendChild(favBtn);
    }

    if (q.image && IMAGES[q.image.key]) {
      const imgWrap = el("div", { cls: "q-image-wrap" });
      const isVideo = q.image.type === "video";
      const imgEl = isVideo
        ? el("video", { cls: "q-image", attrs: { src: IMAGES[q.image.key], controls: "controls" } })
        : el("img", {
            cls: "q-image",
            attrs: { src: IMAGES[q.image.key], alt: "" },
            onClick: () => openLightbox(IMAGES[q.image.key], "image")
          });
      imgWrap.appendChild(imgEl);
      if (q.image.source) {
        imgWrap.appendChild(el("div", { cls: "q-image-source", text: `${tr().imageSource}: ${q.image.source}` }));
      }
      card.appendChild(imgWrap);
    }

    card.appendChild(el("div", { cls: "q-stem", html: formatStemHtml(qData.stem) }));

    const optsWrap = el("div", { cls: "q-options" });
    const optionRealKeys = Object.keys(qData.options);
    const orderKeys = (Array.isArray(q._optionOrder) && q._optionOrder.length === optionRealKeys.length)
      ? q._optionOrder
      : optionRealKeys;
    orderKeys.forEach((letter, i) => {
      const displayLetter = String.fromCharCode(65 + i); // vždy zobrazeno jako A, B, C, ... bez ohledu na skutečný klíč
      const optionText = qData.options[letter];
      const optEl = el("div", { cls: "q-option" });
      optEl.appendChild(el("span", { cls: "opt-letter", text: displayLetter }));
      optEl.appendChild(el("span", { text: optionText }));

      const isClickable = !isAnswered || state.mode === "live" || state.mode === "daily" || state.mode === "test";

      if (isAnswered) {
        if (!isClickable) optEl.classList.add("locked");
        if (state.mode === "browse") {
          if (letter === qData.correct) {
            optEl.classList.add(letter === answer.selected ? "correct" : "reveal-correct-unselected");
          }
          if (letter === answer.selected && letter !== qData.correct) {
            optEl.classList.add("incorrect");
          }
        } else if (letter === answer.selected) {
          optEl.classList.add("selected-neutral");
        }
      }
      if (isClickable) {
        optEl.addEventListener("click", () => selectAnswer(letter));
      }
      optsWrap.appendChild(optEl);
    });
    card.appendChild(optsWrap);

    const expl = el("div", { cls: "explanation" + (isAnswered && state.mode === "browse" ? " visible" : "") });
    if (isAnswered && state.mode === "browse") {
      expl.appendChild(el("span", { cls: "exp-label", text: tr().explanationLabel }));
      expl.appendChild(el("div", { text: qData.explanation }));
      const explImgWrap = buildQuestionImageWrap(q.explanationImage, tr().imageSource);
      if (explImgWrap) expl.appendChild(explImgWrap);
    }
    card.appendChild(expl);

    frag.appendChild(card);

    if (state.mode === "browse" && q.id !== undefined && q.id !== null) {
      frag.appendChild(buildCommentsSection(q.id));
    }

    const navWrap = el("div", { cls: "quiz-nav" });
    const prevBtn = el("button", {
      cls: "next-btn prev-btn",
      text: tr().prev,
      onClick: prevQuestion
    });
    if (idx === 0) prevBtn.disabled = true;
    navWrap.appendChild(prevBtn);
    const nextBtn = el("button", {
      cls: "next-btn",
      text: idx === total - 1 ? tr().finish : tr().next,
      onClick: nextQuestion
    });
    if (!isAnswered) nextBtn.disabled = true;
    navWrap.appendChild(nextBtn);
    frag.appendChild(navWrap);

    return frag;
  }

  function updateTimerDisplay() {
    const timerEl = document.getElementById("timer-display");
    if (!timerEl) return;
    timerEl.textContent = formatTime(state.timerSeconds);
    if (state.timerSeconds <= 60) timerEl.classList.add("warning");
  }

  function renderResults() {
    const frag = el("div");
    const total = state.questions.length;
    let correctCount = 0;
    Object.values(state.answers).forEach(a => { if (a.isCorrect) correctCount++; });
    const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

    const card = el("div", { cls: "results-card" });
    card.appendChild(el("div", { cls: "score-label", text: tr().yourScore }));
    card.appendChild(el("div", { cls: "score", text: `${correctCount} / ${total}` }));
    card.appendChild(el("div", { cls: "score-label", text: `${pct}%` }));

    if (state.mode === "test") {
      const breakdown = {};
      const order = [];
      state.questions.forEach((q, idx) => {
        const chKey = q._chapterKey;
        if (!breakdown[chKey]) { breakdown[chKey] = { correct: 0, total: 0 }; order.push(chKey); }
        breakdown[chKey].total++;
        const a = state.answers[idx];
        if (a && a.isCorrect) breakdown[chKey].correct++;
      });
      const breakdownWrap = el("div", { cls: "results-breakdown" });
      breakdownWrap.appendChild(el("h3", { cls: "results-breakdown-title", text: tr().resultsBreakdownTitle }));
      order.forEach(chKey => {
        const stats = breakdown[chKey];
        const row = el("div", { cls: "breakdown-row" });
        row.appendChild(el("span", { cls: "breakdown-name", text: chapterTitle(state.unitKey, chKey) }));
        const countCls = stats.correct === stats.total ? "all-correct" : "has-mistakes";
        row.appendChild(el("span", { cls: "breakdown-count " + countCls, text: `${stats.correct} / ${stats.total}` }));
        breakdownWrap.appendChild(row);
      });
      card.appendChild(breakdownWrap);
    }

    const actions = el("div", { cls: "results-actions" });
    actions.appendChild(el("button", { cls: "pill-btn primary", text: tr().retryTest, onClick: retrySameTest }));
    actions.appendChild(el("button", { cls: "pill-btn", attrs: { "data-hw-back": "1" }, text: tr().backHome, onClick: goHome }));
    card.appendChild(actions);

    frag.appendChild(card);

    if (state.mode === "test") {
      const reviewSection = el("div", { cls: "test-review" });
      reviewSection.appendChild(el("h2", { cls: "test-review-title", text: tr().testReviewTitle }));
      state.questions.forEach((q, idx) => {
        reviewSection.appendChild(renderTestReviewItem(q, idx));
      });
      frag.appendChild(reviewSection);
    }

    return frag;
  }

  // ============ RENDER: DAILY CHALLENGE VIEWS ============
  function renderDaily() {
    if (daily.view === "results") return renderDailyResults();
    return renderDailyEntry();
  }

  function renderDailyEntry() {
    const frag = el("div");
    frag.appendChild(el("a", { cls: "back-link", attrs: { "data-hw-back": "1" }, text: "← " + tr().dailyBackHome, onClick: goHome }));

    const panel = el("div", { cls: "live-panel" });
    panel.appendChild(el("h1", { text: tr().dailyTitle }));
    panel.appendChild(el("p", { cls: "live-sub", text: tr().dailySub }));

    if (daily.error) {
      panel.appendChild(el("div", { cls: "live-error", text: daily.error }));
    }

    const nameField = el("div", { cls: "live-field" });
    nameField.appendChild(el("label", { text: tr().dailyFieldName }));
    const nameInput = el("input", {
      attrs: { type: "text", placeholder: tr().dailyFieldNamePh, autocomplete: "name", maxlength: "40" }
    });
    nameInput.value = daily.myName || "";
    nameInput.disabled = !!daily.starting;
    nameInput.addEventListener("input", () => { daily.myName = nameInput.value; });
    nameField.appendChild(nameInput);
    panel.appendChild(nameField);

    const dateKey = getPragueDateKeyForDaily();

    DAILY_SCOPES.forEach(scope => {
      const done = isDailyDoneLocally(dateKey, scope.key);
      const row = el("div", { cls: "chapter-row" + (done ? " daily-row-done" : "") });
      row.style.marginTop = "10px";
      if (daily.starting) {
        row.style.opacity = "0.5";
        row.style.pointerEvents = "none";
      } else {
        row.style.cursor = "pointer";
        row.addEventListener("click", () => dailyStartScope(scope));
      }
      const nameCell = el("span", { cls: "ch-name", text: tr()[scope.titleKey] });
      if (done) {
        nameCell.appendChild(el("span", { cls: "daily-badge", text: tr().dailyDoneBadge }));
      }
      row.appendChild(nameCell);
      row.appendChild(el("span", { cls: "ch-count", text: tr().dailyScopeCount }));
      panel.appendChild(row);
    });

    if (daily.starting) {
      panel.appendChild(el("p", { cls: "live-sub", text: tr().dailyStarting }));
    }

    frag.appendChild(panel);
    return frag;
  }

  function renderDailyResults() {
    const frag = el("div");
    frag.appendChild(el("a", { cls: "back-link", attrs: { "data-hw-back": "1" }, text: "← " + tr().dailyBackHome, onClick: dailyBackToEntry }));

    const scope = daily.scope;
    const myResult = daily.myResult;
    const total = (myResult && myResult.total) || DAILY_QUESTION_COUNT;
    const correctCount = myResult ? myResult.correct : 0;
    const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

    const card = el("div", { cls: "results-card" });
    if (scope) {
      card.appendChild(el("div", { cls: "score-label", text: tr()[scope.titleKey] }));
    }
    card.appendChild(el("div", { cls: "score-label", text: tr().dailyYourResultToday }));
    card.appendChild(el("div", { cls: "score", text: `${correctCount} / ${total}` }));
    card.appendChild(el("div", { cls: "score-label", text: `${pct}%` }));
    if (myResult) {
      card.appendChild(el("div", {
        cls: "daily-your-result",
        text: `${tr().dailyYourTime}: ${formatTime(Math.round((myResult.elapsedMs || 0) / 1000))}`
      }));
    }

    if (daily.error) {
      card.appendChild(el("div", { cls: "live-error", text: daily.error }));
    }

    const actions = el("div", { cls: "results-actions" });
    actions.appendChild(el("button", { cls: "pill-btn primary", attrs: { "data-hw-back": "1" }, text: tr().backHome, onClick: goHome }));
    card.appendChild(actions);

    const allResults = daily.leaderboard;
    if (allResults && Object.keys(allResults).length > 0) {
      const lb = el("div", { cls: "live-leaderboard" });
      lb.appendChild(el("div", { cls: "live-leaderboard-title", text: tr().dailyLeaderboardTitle }));
      const sorted = Object.keys(allResults)
        .map(uid => Object.assign({ uid }, allResults[uid]))
        .sort((a, b) => (b.correct - a.correct) || ((a.elapsedMs || 0) - (b.elapsedMs || 0)));
      sorted.forEach((r, idx) => {
        const row = el("div", { cls: "lb-row" + (r.uid === live.uid ? " is-you" : "") });
        row.appendChild(el("span", { cls: "lb-rank", text: `#${idx + 1}` }));
        row.appendChild(el("span", { cls: "lb-name", text: r.name }));
        row.appendChild(el("span", {
          cls: "lb-score",
          text: `${r.correct}/${r.total} · ${formatTime(Math.round((r.elapsedMs || 0) / 1000))}`
        }));
        lb.appendChild(row);
      });
      card.appendChild(lb);
    } else if (allResults) {
      card.appendChild(el("p", { cls: "live-waiting-msg", text: tr().dailyNoResultsYet }));
    }

    card.appendChild(el("p", { cls: "live-sub", text: tr().dailyComeBackTomorrow }));

    frag.appendChild(card);

    const hasFreshAnswers = state.mode === "daily" && state.questions.length > 0 &&
      Object.keys(state.answers || {}).length === state.questions.length;
    if (hasFreshAnswers) {
      const reviewSection = el("div", { cls: "test-review" });
      reviewSection.appendChild(el("h2", { cls: "test-review-title", text: tr().testReviewTitle }));
      state.questions.forEach((q, idx) => {
        reviewSection.appendChild(renderTestReviewItem(q, idx));
      });
      frag.appendChild(reviewSection);
    }

    return frag;
  }

  function renderTestReviewItem(q, idx) {
    const qData = q[state.lang];
    const answer = state.answers[idx];

    const card = el("div", { cls: "question-card review-card" });

    const head = el("div", { cls: "review-head" });
    const reviewQNumberLabel = (q.id !== undefined && q.id !== null) ? q.id : (idx + 1);
    head.appendChild(el("div", { cls: "q-number", text: `${tr().questionIdLabel} ${reviewQNumberLabel}` }));
    let statusCls = "unanswered";
    let statusText = tr().unanswered;
    if (answer) {
      statusCls = answer.isCorrect ? "correct" : "incorrect";
      statusText = answer.isCorrect ? tr().correct : tr().incorrect;
    }
    head.appendChild(el("div", { cls: "review-status " + statusCls, text: statusText }));
    card.appendChild(head);

    if (q.image && IMAGES[q.image.key]) {
      const imgWrap = el("div", { cls: "q-image-wrap" });
      const isVideo = q.image.type === "video";
      const imgEl = isVideo
        ? el("video", { cls: "q-image", attrs: { src: IMAGES[q.image.key], controls: "controls" } })
        : el("img", {
            cls: "q-image",
            attrs: { src: IMAGES[q.image.key], alt: "" },
            onClick: () => openLightbox(IMAGES[q.image.key], "image")
          });
      imgWrap.appendChild(imgEl);
      if (q.image.source) {
        imgWrap.appendChild(el("div", { cls: "q-image-source", text: `${tr().imageSource}: ${q.image.source}` }));
      }
      card.appendChild(imgWrap);
    }

    card.appendChild(el("div", { cls: "q-stem", html: formatStemHtml(qData.stem) }));

    const optsWrap = el("div", { cls: "q-options" });
    const optionRealKeys = Object.keys(qData.options);
    const orderKeys = (Array.isArray(q._optionOrder) && q._optionOrder.length === optionRealKeys.length)
      ? q._optionOrder
      : optionRealKeys;
    orderKeys.forEach((letter, i) => {
      const displayLetter = String.fromCharCode(65 + i);
      const optionText = qData.options[letter];
      const optEl = el("div", { cls: "q-option locked" });
      optEl.appendChild(el("span", { cls: "opt-letter", text: displayLetter }));
      optEl.appendChild(el("span", { text: optionText }));

      if (letter === qData.correct) {
        optEl.classList.add(answer && letter === answer.selected ? "correct" : "reveal-correct-unselected");
      }
      if (answer && letter === answer.selected && letter !== qData.correct) {
        optEl.classList.add("incorrect");
      }
      optsWrap.appendChild(optEl);
    });
    card.appendChild(optsWrap);

    const expl = el("div", { cls: "explanation visible" });
    expl.appendChild(el("span", { cls: "exp-label", text: tr().explanationLabel }));
    expl.appendChild(el("div", { text: qData.explanation }));
    const explImgWrap = buildQuestionImageWrap(q.explanationImage, tr().imageSource);
    if (explImgWrap) expl.appendChild(explImgWrap);
    card.appendChild(expl);

    return card;
  }

  // ============ LANGUAGE TOGGLE ============
  function setLang(lang) {
    state.lang = lang;
    try { localStorage.setItem("usmle-anatomy-lang", lang); } catch (e) {}
    document.getElementById("lang-cz").classList.toggle("active", lang === "cz");
    document.getElementById("lang-en").classList.toggle("active", lang === "en");
    document.documentElement.lang = lang === "cz" ? "cs" : "en";
    document.getElementById("app-footer").textContent = tr().footerVersion;

    // refresh breadcrumb for current view
    if (state.view === "unitMenu") setBreadcrumb([unitTitle(state.unitKey)]);
    else if (state.view === "chapterList") setBreadcrumb([unitTitle(state.unitKey), tr().browseAll]);
    else if (state.view === "chapterMenu") setBreadcrumb([unitTitle(state.unitKey), chapterTitle(state.unitKey, state.chapterKey)]);
    else if (state.view === "quiz") {
      if (state.mode === "live") {
        setBreadcrumb([tr().liveEntryBtn, liveUnitTitle(live.sessionData && live.sessionData.unitKey)]);
      } else if (state.mode === "daily") {
        setBreadcrumb([tr().dailyEntryBtn, daily.scope ? tr()[daily.scope.titleKey] : ""]);
      } else {
        const label = state.mode === "test" ? tr().test30 : tr().browseAll;
        const crumbs = state.chapterKey
          ? [unitTitle(state.unitKey), chapterTitle(state.unitKey, state.chapterKey), label]
          : [unitTitle(state.unitKey), label];
        setBreadcrumb(crumbs);
      }
    } else if (state.view === "daily") {
      setBreadcrumb(daily.scope ? [tr().dailyEntryBtn, tr()[daily.scope.titleKey]] : [tr().dailyEntryBtn]);
    }

    render();
  }

  document.getElementById("lang-cz").addEventListener("click", () => setLang("cz"));

  // ============================================================================
  // ============ LIVE TEST (multiplayer, Firebase Realtime Database) ==========
  // ============================================================================
  //
  // Datový model v Realtime Database:
  //
  // /liveSessions/{sessionId}
  //    code: "ABCDE"                 — krátký kód pro připojení (uppercase)
  //    adminUid: "..."               — uid admina, který session založil
  //    unitKey: "anatomie_1"
  //    questionIds: [12, 5, 99, ...] — konkrétní seznam ID otázek (vybráno při tvorbě)
  //    durationSec: 1800
  //    status: "lobby" | "countdown" | "running" | "finished" | "cancelled"
  //    startAt: <server timestamp ms>   — kdy přesně test začíná (nastaví se při kliknutí "Spustit")
  //    endAt: <server timestamp ms>     — startAt + durationSec*1000 (pro orientaci/timeout)
  //    createdAt: <server timestamp>
  //
  // /liveSessions/{sessionId}/participants/{uid}
  //    name: "Jakub M."
  //    joinedAt: <server timestamp>
  //
  // /liveSessions/{sessionId}/results/{uid}
  //    name: "Jakub M."
  //    correct: 24
  //    total: 30
  //    pct: 80
  //    submittedAt: <server timestamp>
  //
  // /liveSessions/{sessionId}/progress/{uid}
  //    currentIndex: 7          — index aktuální otázky účastníka (0-based)
  //    answered: 8              — počet zatím zodpovězených otázek
  //    total: 30
  //    done: true               — true jakmile účastník odeslal finální výsledek
  //    updatedAt: <server timestamp>
  //    (slouží admin monitoru k živému sledování průběhu, bez nutnosti admina vyplňovat test)
  //
  // Realtime Database Security Rules (vlož do Firebase konzole -> Realtime Database -> Rules):
  //
  // {
  //   "rules": {
  //     "liveSessions": {
  //       "$sessionId": {
  //         ".read": "auth != null",
  //         ".write": "auth != null && (!data.exists() || data.child('adminUid').val() === auth.uid)",
  //         "participants": {
  //           "$uid": {
  //             ".write": "auth != null && auth.uid === $uid"
  //           }
  //         },
  //         "results": {
  //           "$uid": {
  //             ".write": "auth != null && auth.uid === $uid && !data.exists()"
  //           }
  //         },
  //         "progress": {
  //           "$uid": {
  //             ".write": "auth != null && auth.uid === $uid"
  //           }
  //         },
  //         "status": {
  //           ".write": "auth != null && root.child('liveSessions').child($sessionId).child('adminUid').val() === auth.uid"
  //         }
  //       }
  //     }
  //   }
  // }
  //
  // (Pravidla výše umožní komukoli přihlášenému anonymně číst session, ale měnit
  // kořenová pole session smí jen admin; každý účastník smí psát jen do svého
  // vlastního uid pod participants/, results/ a progress/ — výsledek smí zapsat
  // jen jednou, ale progress smí aktualizovat opakovaně v průběhu testu.)

  function getFb() {
    return window.__fb || null;
  }

  function genSessionCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // bez znaků snadno zaměnitelných (0/O, 1/I)
    let out = "";
    for (let i = 0; i < LIVE_CODE_LENGTH; i++) {
      out += chars[Math.floor(Math.random() * chars.length)];
    }
    return out;
  }

  function liveSetError(msg) {
    live.error = msg;
    render();
  }

  function liveResetEphemeral() {
    live.error = "";
    live.creating = false;
    live.joining = false;
  }

  // ---- Auth / server time offset bootstrap ----
  let liveAuthReady = false;
  let liveAuthWaiters = [];

  function waitForAuth() {
    return new Promise((resolve) => {
      if (liveAuthReady && live.uid) { resolve(live.uid); return; }
      liveAuthWaiters.push(resolve);
    });
  }

  // waitForAuth() sám o sobě nemá timeout — pokud se Firebase auth z jakéhokoli
  // důvodu (výpadek sítě, adblock, soukromý režim prohlížeče, blokovaná doména
  // gstatic.com/firebaseapp.com) nikdy nedokončí, čekalo by se navěky a uživatel
  // by po kliknutí neviděl vůbec žádnou reakci ani chybu. Tahle obálka po
  // uplynutí limitu vždy odmítne promise, takže je vždy vidět chybová hláška.
  function waitForAuthOrTimeout(ms) {
    return new Promise((resolve, reject) => {
      let done = false;
      waitForAuth().then((uid) => {
        if (done) return;
        done = true;
        resolve(uid);
      });
      setTimeout(() => {
        if (done) return;
        done = true;
        reject(new Error("auth-timeout"));
      }, ms || 12000);
    });
  }

  window.addEventListener("fb-auth-ready", (e) => {
    liveAuthReady = true;
    live.uid = e.detail && e.detail.uid ? e.detail.uid : null;
    live.isAdminUnlocked = !!(e.detail && e.detail.isAdmin);
    if (live.uid) {
      const waiters = liveAuthWaiters;
      liveAuthWaiters = [];
      waiters.forEach(fn => fn(live.uid));
      liveAttemptAutoRejoin();
    }
    render();
  });

  function subscribeServerOffset() {
    const fb = getFb();
    if (!fb) { window.addEventListener("fb-ready", subscribeServerOffset, { once: true }); return; }
    const offsetRef = fb.ref(fb.db, ".info/serverTimeOffset");
    fb.onValue(offsetRef, (snap) => {
      const val = snap.val();
      if (typeof val === "number") live.serverOffset = val;
    });
  }
  subscribeServerOffset();

  function serverNow() {
    return Date.now() + (live.serverOffset || 0);
  }

  // ---- Navigation entry points ----
  function openLiveEntry() {

  // Vrátí aktuální den v týdnu a hodinu v PRAŽSKÉM čase (Europe/Prague),
  // bez ohledu na to, v jakém časovém pásmu má uživatel nastavené zařízení
  // nebo prohlížeč. Předtím se používalo now.getDay()/now.getHours(), což
  // je vždy lokální čas ZAŘÍZENÍ — pokud uživatel neměl zařízení nastavené
  // na Prahu, okno dostupnosti automatického kola se posunulo nebo úplně
  // zmizelo, i uprostřed skutečné sobotní 14–20 SELČ.
  function getPragueNowParts() {
    const now = new Date();
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "Europe/Prague",
      weekday: "short",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      hour12: false
    });
    const parts = {};
    fmt.formatToParts(now).forEach(p => { parts[p.type] = p.value; });
    let hour = parseInt(parts.hour, 10);
    if (hour === 24) hour = 0; // některé prostředí vrací "24" místo "00" o půlnoci
    const weekdayMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    return {
      day: weekdayMap[parts.weekday],
      hour,
      year: parts.year,
      month: parts.month,
      date: parts.day
    };
  }

  function getAutomaticLiveConfig() {
    const prague = getPragueNowParts();
    if (prague.day !== 6) return null;

    const slots = [
      { start: 14, end: 16, unit: 1 },
      { start: 16, end: 18, unit: 2 },
      { start: 18, end: 20, unit: 3 }
    ];
    const slot = slots.find(s => prague.hour >= s.start && prague.hour < s.end);
    if (!slot) return null;

    // Anchor v UTC: rozdíl dvou absolutních časů je stejný pro každého
    // bez ohledu na časové pásmo, takže tohle je bezpečné i nezávisle na Praze.
    const base = new Date("2026-07-04T00:00:00Z");
    const weekIndex = Math.max(0, Math.floor((Date.now() - base.getTime()) / (7 * 24 * 60 * 60 * 1000)));
    const version = (weekIndex % 3) + 1;
    const unitKey = `anatomie_${slot.unit}_verze_${version}`;
    const dateKey = `${prague.year}${prague.month}${prague.date}`;

    return {
      sessionId: `auto-${dateKey}-${unitKey}`,
      unitKey,
      startHour: slot.start,
      endHour: slot.end,
      slotUnit: slot.unit
    };
  }

  async function liveJoinAutomaticSession(expectedSlotUnit) {
    if (live.joining) return;
    liveResetEphemeral();
    const cfg = getAutomaticLiveConfig();
    if (!cfg || (expectedSlotUnit != null && cfg.slotUnit !== expectedSlotUnit)) {
      liveSetError(tr().liveErrAutoUnavailable);
      return;
    }

    const bank = LIVE_QUESTION_BANKS[cfg.unitKey];
    const bankSource = bank ? getLiveSessionQuestionSource(cfg.unitKey, bank) : [];
    if (!bank || bankSource.length === 0) {
      liveSetError(tr().liveErrGeneric);
      return;
    }

    live.joining = true;
    state.view = "live";
    live.view = "entry";
    render();

    try {
      const uid = await waitForAuthOrTimeout();
      const fb = getFb();
      if (!fb || !uid) { liveSetError(tr().liveErrGeneric); live.joining = false; render(); return; }

      const sessionRef = fb.ref(fb.db, `liveSessions/${cfg.sessionId}`);
      const snap = await fb.get(sessionRef);
      let data = snap.val();

      if (!data) {
        const pool = prepareQuestionsForSession(bankSource);
        const selected = pool.slice(0, Math.min(bank.qCount, pool.length));
        const startAt = serverNow();
        data = {
          code: "AUTO",
          auto: true,
          autoNoCode: true,
          adminUid: "__auto__",
          unitKey: cfg.unitKey,
          questionIds: selected.map(q => q.id),
          optionOrderSeed: Math.floor(Math.random() * 1e9),
          durationSec: bank.durationMin * 60,
          status: "running",
          startAt,
          endAt: startAt + bank.durationMin * 60 * 1000,
          createdAt: fb.serverTimestamp()
        };
        await fb.set(sessionRef, data);
      }

      const name = (live.myName || "").trim() || "Účastník";
      try { localStorage.setItem("usmle-live-name", name); } catch (e) {}
      live.myName = name;

      const participantRef = fb.ref(fb.db, `liveSessions/${cfg.sessionId}/participants/${uid}`);
      await fb.set(participantRef, { name, joinedAt: fb.serverTimestamp() });

      live.sessionId = cfg.sessionId;
      live.isAdmin = false;
      liveSaveActiveSession(live.sessionId, live.isAdmin);
      liveAttachSessionListener();
    } catch (err) {
      console.error("liveJoinAutomaticSession error:", err);
      liveSetError(tr().liveErrGeneric);
      live.joining = false;
      render();
    }
  }

  window.openAutomaticLiveTest = liveJoinAutomaticSession;
